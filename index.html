/* ══════════════════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO

   Anclado en la identidad de Kenta: azul #0072CE (Pantone 285C) sobre gris
   frío. El rojo está reservado, en toda la aplicación, para un solo uso:
   márgenes negativos. Si algo está en rojo, se está perdiendo plata.

   Tres tipografías con roles distintos:
     Archivo        títulos, con tracking cerrado. Cuadrada, industrial.
     Inter          texto e interfaz.
     IBM Plex Mono  TODOS los números.

   El mono en los números no es decorativo: en una tabla de márgenes las
   columnas tienen que alinearse dígito a dígito para poder barrerlas con la

:root {
  --ink: #0E1726;
  --ink-2: #3D4A5C;
  --muted: #6B7A8F;

  --perdida: #C0392B;
  --perdida-tint: #FBEBE9;

  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --display: 'Archivo', 'Inter', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;

  --r: 6px;
  --sombra: 0 1px 2px rgba(14, 23, 38, .06), 0 8px 24px -12px rgba(14, 23, 38, .18);

* { box-sizing: border-box; }

html, body { height: 100%; }

/* ── Arranque ──────────────────────────────────────────────────────────── */
.arranque {

/* ══════════════════════════════════════════════════════════════════════════
   BARRA DE MARGEN — el elemento distintivo de la interfaz

   Anclada en una línea de cero central: crece a la derecha si hay ganancia y
   a la izquierda si hay pérdida. Recorriendo una columna, las pérdidas
   sobresalen hacia el lado contrario y se ven sin leer un número.

   Sin umbrales de color intermedios: el único corte que importa es el cero, y
   la línea del cero es la regla dibujada. La escala satura en ±40% porque
   arriba de eso la diferencia no cambia ninguna decisión, y comprimirla haría
   ilegibles los márgenes chicos, que son los que hay que vigilar.
   ══════════════════════════════════════════════════════════════════════════ */
.margen { display: flex; align-items: center; gap: 9px; }
.margen__pista {
  position: relative; flex: 1; min-width: 62px; height: 15px;
  background: var(--surface-2); border-radius: 2px; overflow: hidden;
}
.margen__pista::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
  width: 1px; background: var(--rule-fuerte); z-index: 1;
}
.margen__barra {
  position: absolute; top: 3px; bottom: 3px; border-radius: 1px;
  background: var(--kenta); animation: crece .35s ease-out;
}
.margen--perdida .margen__barra { background: var(--perdida); }
.margen__valor {
  font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
  min-width: 48px; text-align: right; font-weight: 500;
}
.margen--perdida .margen__valor { color: var(--perdida); }
.margen--vacio { color: var(--tenue); font-family: var(--mono); }
@keyframes crece { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) {

  .arranque__barra::after { animation: none; width: 100%; }
}

<!--
  Diagnóstico de arranque.

  Script clásico (no módulo) a propósito: si los módulos ES no se ejecutan
  —el caso típico es abrir el archivo con doble clic, porque file:// los
  bloquea— este script igual corre y explica qué pasó. Sin esto la pantalla de
  carga se queda fija para siempre sin decir nada.
-->
<script>
(function () {
  var errores = [];
  var registrar = function (msg) { if (msg && errores.indexOf(msg) < 0) errores.push(msg); };

  window.addEventListener('error', function (e) {
    if (e.target && e.target.src) registrar('No se pudo cargar el archivo: ' + e.target.src);
    else registrar(e.message);
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    registrar(String((e.reason && e.reason.message) || e.reason));
  });

  setTimeout(function () {
    if (window.__appArranco) return;
    var caja = document.getElementById('cargando');
    if (!caja) return;

    var esArchivo = location.protocol === 'file:';

   *   'por_fuera' → la tasa se aplica y LUEGO se le suma IVA (Frávega, OnCity,
   *                 Tienda BNA). Ej: 15% sobre $100 c/IVA = $15 + IVA = $18,15
   *                 facturado, de los cuales $3,15 son IVA crédito → costo
   *                 real $15,00.
   *
   * Consecuencia práctica: la MISMA tasa nominal cuesta 21% más en Frávega que
   * en MercadoLibre. Por eso las tasas nunca se comparan de forma directa.
   */
  const costoNetoPorcentual = (pvpConIva, tasa, modoIva, iva) => {
    const bruto = num(pvpConIva) * num(tasa);
    return modoIva === 'por_fuera' ? bruto : bruto / (1 + num(iva));
  };

  /** Importe bruto efectivamente facturado por un cargo porcentual. */
  const cargoFacturado = (pvpConIva, tasa, modoIva, iva) => {
    const base = num(pvpConIva) * num(tasa);
    return modoIva === 'por_fuera' ? base * (1 + num(iva)) : base;
  };

  const redondear = (v, decimales = 2) => {
    const f = Math.pow(10, decimales);
    return Math.round(num(v) * f) / f;
  };

  /** División protegida: devuelve null en lugar de Infinity o NaN. */
  const dividir = (a, b) => {
    const d = num(b);
    return d === 0 ? null : num(a) / d;
  };

  __exp['num'] = num;
  __exp['aNeto'] = aNeto;
  __exp['aConIva'] = aConIva;
  __exp['costoNetoPorcentual'] = costoNetoPorcentual;
  __exp['cargoFacturado'] = cargoFacturado;
  __exp['redondear'] = redondear;
  __exp['dividir'] = dividir;
  return __exp;
});

__def('core/tarifas.js', (__req) => {
  const __exp = {};
  /**
   * tarifas.js — resolución de tablas de tarifas y peso facturable.
   *
   * Una tarifa es una fila con esta forma:
   *   { peso_min, peso_max, precio_min, precio_max, valor_c_iva, vigencia_desde }
   *
   * Todas las tablas del sistema (envío ML, comisión fija ML, fee logístico de
   * Frávega, OnCity y ViaCompras) usan la MISMA estructura. Eso permite un único
   * buscador y que agregar un marketplace sea insertar filas, no escribir código.
   */

  const { num } = __req('core/money.js');
  /**
   * Convención de bordes, definida con el cliente sobre el tarifario de
   * ViaCompras: el mínimo es EXCLUYENTE y el máximo INCLUYENTE.
   *
   *   Escalón "1 kg a 5 kg" → un bulto de 5,0 kg entra; uno de 5,1 kg no.
   *
   * Se aplica igual a todas las tablas para que no haya sorpresas al comparar
   * marketplaces con el mismo peso.
   */
  const pesoEnEscalon = (peso, fila) =>
    num(peso) > num(fila.peso_min) && num(peso) <= num(fila.peso_max);

  /**
   * El tramo de precio usa mínimo INCLUYENTE y máximo EXCLUYENTE, porque así
   * están redactados los tarifarios de ML ("De $33.000 a $49.999", "Más de
   * $50.000"): un precio de exactamente $50.000 cae en el tramo superior.
   */
  const precioEnTramo = (pvp, fila) =>
    num(pvp) >= num(fila.precio_min) && num(pvp) < num(fila.precio_max);

  /**
   * Devuelve el valor CON IVA de la tarifa aplicable, o null si el peso o el
   * precio caen fuera de la tabla.
   *
   * Devolver null en vez de 0 es deliberado: un cero silencioso se confunde con
   * "envío gratis" y esconde el problema. El motor propaga el null como una
   * advertencia visible en la pantalla de rentabilidad.
   */
  const buscarTarifa = (tabla, peso, pvpConIva) => {
    if (!Array.isArray(tabla) || tabla.length === 0) return null;
    const fila = tabla.find((f) => pesoEnEscalon(peso, f) && precioEnTramo(pvpConIva, f));
    return fila ? num(fila.valor_c_iva) : null;
  };

  /** Peso volumétrico = (alto x ancho x largo) / divisor. Divisor 4000 en ML. */
  const pesoVolumetrico = (alto, ancho, largo, divisor = 4000) => {
    const a = num(alto), b = num(ancho), c = num(largo), d = num(divisor);
    if (a <= 0 || b <= 0 || c <= 0 || d <= 0) return null;
    return (a * b * c) / d;
  };

  /**
   * Peso facturable: el MAYOR entre el peso físico y el volumétrico.
   * Criterio confirmado contra la documentación de MercadoLibre.
   *
   * `volumetricoManual` existe porque en ML el peso volumétrico lo cargamos a
   * mano en la publicación, y ese valor —no el que saldría de las medidas— es el
   * que ML factura. Si está presente, gana sobre el calculado.
   */
  const pesoFacturable = ({
    pesoReal, alto, ancho, largo, divisor = 4000, volumetricoManual = null,
  }) => {
    const vol = num(volumetricoManual) > 0
      ? num(volumetricoManual)
      : pesoVolumetrico(alto, ancho, largo, divisor);
    const real = num(pesoReal);
    if (vol === null) return real > 0 ? real : null;
    return Math.max(real, vol);
  };

  /** Filtra tarifas por vigencia, quedándose con la más reciente ya aplicable. */
  const vigentesA = (tabla, fecha = new Date()) => {
    if (!Array.isArray(tabla)) return [];
    const ref = fecha instanceof Date ? fecha : new Date(fecha);
    const aplicables = tabla.filter(
      (f) => !f.vigencia_desde || new Date(f.vigencia_desde) <= ref
    );
    const ultima = aplicables.reduce((max, f) => {
      const v = f.vigencia_desde ? String(f.vigencia_desde) : '';
      return v > max ? v : max;
    }, '');
    return aplicables.filter((f) => (f.vigencia_desde ? String(f.vigencia_desde) : '') === ultima);
  };

  __exp['pesoEnEscalon'] = pesoEnEscalon;
  __exp['precioEnTramo'] = precioEnTramo;
  __exp['buscarTarifa'] = buscarTarifa;
  __exp['pesoVolumetrico'] = pesoVolumetrico;
  __exp['pesoFacturable'] = pesoFacturable;
  __exp['vigentesA'] = vigentesA;
  return __exp;
});

__def('core/marketplaces/meli.js', (__req) => {
  const __exp = {};
  /**
   * MercadoLibre — el marketplace más complejo del sistema.
   *
   * Particularidades que ningún otro tiene:
   *
   * 1. RÉGIMEN DUAL por umbral de precio (hoy $33.000, configurable):
   *      - PVP >= umbral  → el envío es gratis para el comprador y lo absorbemos
   *                         nosotros. NO hay cargo fijo por venta.
   *      - PVP <  umbral  → no pagamos envío, pero ML cobra un CARGO FIJO por
   *                         venta que depende del peso y del tramo de precio.
   *    Nunca se pagan las dos cosas a la vez.
   *
   * 2. PESO VOLUMÉTRICO MANUAL: en ML el peso volumétrico se carga a mano en la
   *    publicación, y ML factura por ESE valor. Si está cargado, se usa tal cual
   *    en lugar de recalcularlo desde las medidas.
   *
   * 3. ENVÍO ME1: productos grandes (grupos electrógenos, heladeras, cocinas) que
   *    despachamos por fuera de la logística de ML. No hay tarifa de tabla: el
   *    importe se carga a mano, con IVA incluido, y el motor lo netea.
   *
   * 4. La tasa de comisión de ML YA CONTIENE IVA (modo 'incluido').
   */

  const { num } = __req('core/money.js');
  const { buscarTarifa, pesoFacturable } = __req('core/tarifas.js');
  __exp.default = {
    id: 'ML',
    nombre: 'MercadoLibre',
    comisionIvaMode: 'incluido',
    financiacionIvaMode: 'incluido',
    soportaVariantesDeCuotas: true,

    /**
     * En ML un mismo producto tiene una publicación por modalidad de cuotas, cada
     * una con su propio precio. El comparador nunca cruza modalidades distintas.
     */
    pesoFacturable(ctx) {
      const { producto, pm, cfg } = ctx;
      return pesoFacturable({
        pesoReal: num(pm.peso_real) > 0 ? pm.peso_real : producto.peso_real,
        alto: pm.alto, ancho: pm.ancho, largo: pm.largo,
        divisor: cfg.divisorVolumetrico,
        volumetricoManual: pm.peso_volumetrico_manual,
      });
    },

    resolverLogistica(ctx) {
      const { pm, pvpConIva, cfg, tarifas } = ctx;
      const peso = this.pesoFacturable(ctx);
      const advertencias = [];
      const umbral = num(cfg.marketplaces.ML.umbralEnvio);

      if (String(pm.modalidad_envio || '').toUpperCase() === 'ME1') {
        const manual = num(pm.envio_me1_manual_c_iva);
        if (manual <= 0) {
          advertencias.push('Marcado como ME1 pero sin importe de envío cargado.');
        }
        return { pesoFacturable: peso, logisticaCIva: manual, comisionFijaCIva: 0, regimen: 'ME1', advertencias };
      }

      if (peso === null) {
        advertencias.push('Sin peso ni medidas: no se puede determinar la tarifa.');
        return { pesoFacturable: null, logisticaCIva: 0, comisionFijaCIva: 0, regimen: 'INDETERMINADO', advertencias };
      }

      if (num(pvpConIva) >= umbral) {
        const envio = buscarTarifa(tarifas.ML_ENVIO, peso, pvpConIva);
        if (envio === null) {
          advertencias.push(`Sin tarifa de envío para ${peso.toFixed(2)} kg. ¿Corresponde ME1?`);
        }
        return {
          pesoFacturable: peso,
          logisticaCIva: num(envio),
          comisionFijaCIva: 0,
          regimen: 'ENVIO_GRATIS',
          advertencias,
        };
      }

      const fija = buscarTarifa(tarifas.ML_COMISION_FIJA, peso, pvpConIva);
      if (fija === null) {
        advertencias.push(`Sin cargo fijo tabulado para ${peso.toFixed(2)} kg.`);
      }
      return {
        pesoFacturable: peso,
        logisticaCIva: 0,
        comisionFijaCIva: num(fija),
        regimen: 'CARGO_FIJO',
        advertencias,
      };
    },

    /** ML no tiene cargos porcentuales propios más allá de comisión y financiación. */
    cargosExtra() {
      return [];
    },
  };


  return __exp;
});

__def('core/marketplaces/feeLogistico.js', (__req) => {

   * marketplace nuevo de este tipo son tres líneas de configuración.
   */

  const { num } = __req('core/money.js');
  const { buscarTarifa, pesoFacturable } = __req('core/tarifas.js');
  const crearMarketplaceConFee = ({
    id,

    tablaTarifas,
    comisionIvaMode = 'por_fuera',
    financiacionIvaMode = 'por_fuera',
    soportaVariantesDeCuotas = false,
    cargosExtra = () => [],
    exigeTarifa = true,
  }) => ({
    id,
    nombre,
    comisionIvaMode,
    financiacionIvaMode,
    soportaVariantesDeCuotas,

    pesoFacturable(ctx) {
      const { producto, pm, cfg } = ctx;
      return pesoFacturable({
        pesoReal: num(pm.peso_real) > 0 ? pm.peso_real : producto.peso_real,
        alto: pm.alto,

__def('core/engine.js', (__req) => {
  const __exp = {};
  /**
   * engine.js — motor de cálculo de rentabilidad.
   *
   * Función pura: mismas entradas, mismas salidas, sin efectos secundarios y sin
   * tocar el DOM ni la red. Eso permite recalcular todo el catálogo en memoria
   * mientras el usuario tipea un precio, y testear los números contra la planilla.
   *
   * ═══════════════════════════════════════════════════════════════════════════
   * ESPECIFICACIÓN DE CÁLCULO (validada con el cliente, julio 2026)
   * ═══════════════════════════════════════════════════════════════════════════
   *
   *   Ingreso neto          = PVP_c_IVA / (1 + IVA)
   *
   *   − Comisión            ML:                 tasa / (1+IVA) x PVP_c_IVA
   *                         Frávega/OnCity/BNA: tasa x PVP_c_IVA
   *   − Costo financiero    mismo tratamiento de IVA que la comisión
   *   − Logística           tarifa_c_IVA / (1 + IVA)
   *   − Cargo fijo (ML)     cargo_c_IVA / (1 + IVA)
   *   − IIBB                IIBB% x PVP_c_IVA            ← BRUTO, sin crédito
   *   − Imp. Déb/Créd       1,2% x PVP_c_IVA             ← BRUTO, sin crédito
   *   − Publicidad          pub% / (1+IVA) x PVP_c_IVA   ← por producto
   *   − Gastos varios       var% / (1+IVA) x PVP_c_IVA   ← por producto
   *   − Cargos extra        según marketplace (ej. procesamiento BNA)
   *   − Costo producto      USD x TC                     ← ya neto de IVA
   *   ─────────────────────────────────────────────
   *   = Utilidad neta
   *
   * Dos puntos donde esto corrige la planilla original:
   *
   *   • IIBB se calculaba sobre el precio SIN IVA. Al no ser un impuesto con
   *     crédito fiscal, corresponde el precio CON IVA: la planilla lo subestimaba
   *     un 17,4% en la hoja de MercadoLibre. Sobre una freidora de $129.999 son
   *     $903 por unidad, el 16% de la ganancia declarada.
   *
   *   • El Impuesto al Débito y Crédito (1,2%) no estaba contemplado.
   *
   * ═══════════════════════════════════════════════════════════════════════════
   * PRECIOS EN CUOTAS
   * ═══════════════════════════════════════════════════════════════════════════
   * Cada modalidad se calcula SIEMPRE desde el precio de contado, nunca desde la
   * modalidad anterior. La planilla original las encadenaba, y eso multiplicaba
   * los recargos: 12 cuotas terminaba en 2,42x el contado en lugar de 1,317x.
   */

  const { num, dividir, redondear, aNeto, costoNetoPorcentual, cargoFacturado } = __req('core/money.js');
  const { obtenerMarketplace } = __req('core/marketplaces/index.js');
  const CONTADO = 'CONTADO';

  /** Normaliza la modalidad: 'CONTADO' o cantidad de cuotas como número. */
  const normalizarModalidad = (m) => {
    if (m === null || m === undefined || m === '' ) return CONTADO;
    const s = String(m).trim().toUpperCase();
    if (s === CONTADO || s === '0' || s === '1' || s === 'SIN CUOTAS') return CONTADO;
    const n = parseInt(s, 10);
    return Number.isFinite(n) && n > 1 ? n : CONTADO;
  };

  /** Devuelve { costo_real, markup } de una modalidad, o ceros si es contado. */
  const parametrosFinanciacion = (cfg, marketplaceId, modalidad) => {
    const mod = normalizarModalidad(modalidad);
    if (mod === CONTADO) return { costoReal: 0, markup: 0 };
    const tabla = cfg.financiacion?.[marketplaceId] ?? {};
    const fila = tabla[mod] ?? tabla[String(mod)];
    return { costoReal: num(fila?.costo_real), markup: num(fila?.markup) };
  };

  /**
   * Rentabilidad de un producto en un marketplace, a un precio y una modalidad.
   *
   * @returns desglose completo, en valores netos salvo donde se indica.
   */
  const calcularRentabilidad = ({
    producto,
    pm,                  // fila de ProductoMarketplace
    marketplaceId,
    modalidad = CONTADO,
    pvpConIva,
    cfg,
    tarifas,
  }) => {
    const mp = obtenerMarketplace(marketplaceId);
    const iva = num(cfg.iva);
    const pvp = num(pvpConIva);
    const mod = normalizarModalidad(modalidad);
    const ctx = { producto, pm, pvpConIva: pvp, cfg, tarifas, marketplaceId: mp.id };

    const ingresoNeto = aNeto(pvp, iva);
    const logistica = mp.resolverLogistica(ctx);
    const advertencias = [...(logistica.advertencias || [])];

    // ── Comisión y financiación ────────────────────────────────────────────
    const tasaComision = num(pm.comision_pct) > 0
      ? num(pm.comision_pct)
      : num(cfg.marketplaces[mp.id]?.comisionPctDefault);
    const { costoReal: tasaFinanciera, markup } = parametrosFinanciacion(cfg, mp.id, mod);

    const comision = costoNetoPorcentual(pvp, tasaComision, mp.comisionIvaMode, iva);
    const costoFinanciero = costoNetoPorcentual(pvp, tasaFinanciera, mp.financiacionIvaMode, iva);

    // ── Logística ──────────────────────────────────────────────────────────
    const costoLogistico = aNeto(logistica.logisticaCIva, iva);
    const cargoFijo = aNeto(logistica.comisionFijaCIva, iva);

    // ── Impuestos sin crédito fiscal: sobre el precio CON IVA ──────────────
    const iibb = pvp * num(cfg.iibbPct);
    const impDebCred = pvp * num(cfg.impDebCredPct);

    // ── Gastos con crédito fiscal: se netean ───────────────────────────────
    const publicidad = costoNetoPorcentual(pvp, num(pm.publicidad_pct), 'incluido', iva);
    const varios = costoNetoPorcentual(pvp, num(pm.varios_pct), 'incluido', iva);

    // ── Cargos propios del marketplace (ej. procesamiento de pagos BNA) ────
    const extras = mp.cargosExtra(ctx).map((c) => ({
      concepto: c.concepto,
      importe: costoNetoPorcentual(pvp, c.tasa, c.modoIva, iva),
      tasa: num(c.tasa),
    }));
    const totalExtras = extras.reduce((s, c) => s + c.importe, 0);

    // ── Costo del producto: ya viene neto de IVA ───────────────────────────
    const costoProducto = num(producto.costo_usd) * num(cfg.tc);
    if (costoProducto <= 0) advertencias.push('Producto sin costo en USD cargado.');
    if (pvp <= 0) advertencias.push('Producto sin precio de venta cargado.');

    const totalCostos = comision + costoFinanciero + costoLogistico + cargoFijo
      + iibb + impDebCred + publicidad + varios + totalExtras + costoProducto;

    const utilidad = ingresoNeto - totalCostos;

    return {
      sku: producto.sku,
      marketplaceId: mp.id,
      marketplace: mp.nombre,
      modalidad: mod,
      cuotas: mod === CONTADO ? 0 : mod,

      pvpConIva: pvp,
      ingresoNeto,
      pesoFacturable: logistica.pesoFacturable,
      regimenLogistico: logistica.regimen,

      costos: {
        comision,
        costoFinanciero,
        costoLogistico,
        cargoFijo,
        iibb,
        impDebCred,
        publicidad,
        varios,
        extras,
        costoProducto,
        total: totalCostos,
      },

      // Importes efectivamente facturados por terceros, útiles para conciliar
      // contra la factura del marketplace.
      facturado: {
        comision: cargoFacturado(pvp, tasaComision, mp.comisionIvaMode, iva),
        costoFinanciero: cargoFacturado(pvp, tasaFinanciera, mp.financiacionIvaMode, iva),
        logistica: num(logistica.logisticaCIva),
        cargoFijo: num(logistica.comisionFijaCIva),
      },

      tasas: { comision: tasaComision, financiacion: tasaFinanciera, markup },

      utilidad,
      margenSobreFacturacionNeta: dividir(utilidad, ingresoNeto),
      margenSobrePvpConIva: dividir(utilidad, pvp),
      rentabilidadSobreCosto: dividir(utilidad, costoProducto),

      negativo: utilidad < 0,
      advertencias,
    };
  };

  /**
   * Precio sugerido de una modalidad a partir del precio de contado.
   *
   *   precio = contado x (1 + costo_financiero + markup)
   *
   * Cada modalidad parte del contado. El markup es nuestro margen adicional por
   * encima del costo que cobra el marketplace, configurable por modalidad.
   */
  const precioSugeridoModalidad = ({ pvpContado, cfg, marketplaceId, modalidad }) => {
    const { costoReal, markup } = parametrosFinanciacion(cfg, marketplaceId, modalidad);
    return num(pvpContado) * (1 + costoReal + markup);
  };

  /**
   * Precio equivalente de contado: normaliza un precio en cuotas para poder
   * comparar entre marketplaces sin mezclar condiciones comerciales.
   */
  const precioEquivalenteContado = ({ pvpConIva, cfg, marketplaceId, modalidad }) => {
    const { costoReal, markup } = parametrosFinanciacion(cfg, marketplaceId, modalidad);
    const factor = 1 + costoReal + markup;
    return factor === 0 ? num(pvpConIva) : num(pvpConIva) / factor;
  };

  /**
   * Despeje inverso: qué precio hay que publicar para alcanzar un margen objetivo.
   *
   * No se puede resolver algebraicamente porque la logística y el cargo fijo son
   * funciones escalonadas del propio precio (cruzar $33.000 cambia el régimen
   * completo). Se resuelve iterando: converge en 3 o 4 pasos.
   */
  const precioParaMargen = ({
    producto, pm, marketplaceId, modalidad = CONTADO, cfg, tarifas,
    margenObjetivo,                 // fracción sobre facturación neta, ej. 0.15
    maxIteraciones = 40,
    tolerancia = 0.00005,
  }) => {
    const iva = num(cfg.iva);
    const costoProducto = num(producto.costo_usd) * num(cfg.tc);
    // Semilla razonable: costo inflado por el margen objetivo y el IVA.
    let pvp = costoProducto * (1 + iva) * (1 + num(margenObjetivo) + 0.35);
    if (!(pvp > 0)) pvp = 1000;

    let r = null;
    for (let i = 0; i < maxIteraciones; i += 1) {
      r = calcularRentabilidad({ producto, pm, marketplaceId, modalidad, pvpConIva: pvp, cfg, tarifas });
      const margen = r.margenSobreFacturacionNeta ?? 0;
      const error = num(margenObjetivo) - margen;
      if (Math.abs(error) < tolerancia) {
        return { pvpConIva: redondear(pvp, 2), iteraciones: i + 1, convergio: true, resultado: r };
      }
      // El margen crece de forma casi lineal con el precio: corrección proporcional
      // amortiguada para no oscilar en los saltos de escalón.
      pvp *= 1 + error * 0.9;
      if (!(pvp > 0) || !Number.isFinite(pvp)) {
        return { pvpConIva: null, iteraciones: i + 1, convergio: false, resultado: r };
      }
    }
    return { pvpConIva: redondear(pvp, 2), iteraciones: maxIteraciones, convergio: false, resultado: r };
  };

  /**
   * Calcula todas las publicaciones de un producto en todos los marketplaces.
   * Es la entrada que usan las pantallas: una sola pasada, todo en memoria.
   */
  const calcularProducto = ({ producto, productoMarketplaces, publicaciones, cfg, tarifas }) => {
    const resultados = [];
    publicaciones
      .filter((p) => String(p.sku) === String(producto.sku) && p.estado !== 'INACTIVA')
      .forEach((pub) => {
        const pm = productoMarketplaces.find(
          (x) => String(x.sku) === String(producto.sku)
            && String(x.marketplace_id).toUpperCase() === String(pub.marketplace_id).toUpperCase()
        );
        if (!pm || pm.activo === false) return;
        resultados.push(calcularRentabilidad({
          producto, pm,
          marketplaceId: pub.marketplace_id,
          modalidad: pub.modalidad,
          pvpConIva: pub.pvp_c_iva,
          cfg, tarifas,
        }));
      });
    return resultados;
  };

  __exp['CONTADO'] = CONTADO;
  __exp['normalizarModalidad'] = normalizarModalidad;
  __exp['parametrosFinanciacion'] = parametrosFinanciacion;
  __exp['calcularRentabilidad'] = calcularRentabilidad;
  __exp['precioSugeridoModalidad'] = precioSugeridoModalidad;
  __exp['precioEquivalenteContado'] = precioEquivalenteContado;
  __exp['precioParaMargen'] = precioParaMargen;
  __exp['calcularProducto'] = calcularProducto;
  return __exp;
});

__def('data/api.js', (__req) => {
  const __exp = {};
  /**
   * api.js — única puerta de salida hacia el backend.
   *
   * Ninguna vista habla con la red directamente: piden datos al store y el store
   * los pide acá. Así cambiar de backend es tocar este archivo y nada más.
   */

  // ═══════════════════════════════════════════════════════════════════════════
  // CONFIGURACIÓN — lo único que hay que editar en este archivo
  // ═══════════════════════════════════════════════════════════════════════════

  /** URL /exec del Apps Script. */
  const API_URL = 'https://script.google.com/macros/s/AKfycbyWYqPteCdnbToWm6U-7VvxSHABE8WeNzSUgSt3jYTEul1pLKvvqKni0A9Z-mfEH4KC/exec';

  /** Debe coincidir con WRITE_TOKEN en Code.gs. Sólo se usa para escribir. */
  const WRITE_TOKEN = 'bitek-2026-cambiar-esto';

  /**
   * Modo de origen de datos:
   *
   *   'auto'   intenta el Apps Script y, si no responde, usa los datos de ejemplo
   *            embebidos. Es el modo normal: la aplicación arranca siempre, y en
   *            cuanto el backend esté desplegado empieza a usarlo sola, sin tocar
   *            una línea.
   *   'remoto' exige el Apps Script. Si falla, muestra el error en vez de
   *            disimularlo con datos de ejemplo.
   *   'local'  fuerza los datos de ejemplo, incluso con el backend andando.
   *
   * El cartel del encabezado dice en todo momento cuál está activo, así que nunca
   * hay dudas sobre si lo que se ve en pantalla es real o de ejemplo.
   */
  const MODO_DATOS = 'auto';

  /** Segundos de espera antes de dar por caído el backend en modo 'auto'. */
  const ESPERA_BACKEND = 12;

  /** Compatibilidad con la constante anterior. */
  const USAR_DATOS_LOCALES = MODO_DATOS === 'local';

  // ═══════════════════════════════════════════════════════════════════════════

  const RUTA_DEMO = './data/demo.json';

  /**
   * Estado real de la conexión, resuelto al arrancar. Las escrituras lo consultan:
   * si la app terminó usando datos de ejemplo, guardar no tiene sentido y avisa en
   * lugar de fallar contra el servidor.
   */
  const conexion = { fuente: null, motivo: null };

  const hayBackend = () => conexion.fuente === 'remoto';

  /**
   * Apps Script no responde el preflight de CORS, así que las escrituras van como
   * text/plain: es un "simple request" y el navegador no lo pide.
   */
  const postear = async (cuerpo) => {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...cuerpo, token: WRITE_TOKEN }),
      redirect: 'follow',
    });
    const texto = await resp.text();
    let datos;
    try {
      datos = JSON.parse(texto);
    } catch {
      throw new Error('El backend respondió algo que no es JSON. Revisá que la implementación esté en "Ejecutar como: Yo" y "Acceso: Cualquier persona".');
    }
    if (!datos.ok) throw new Error(datos.error || 'El backend rechazó la operación.');
    return datos;
  };

  /** Datos de ejemplo: embebidos en la versión de un solo archivo, o desde disco. */
  const traerDemo = async (motivo) => {
    conexion.fuente = 'local';
    conexion.motivo = motivo;
    if (globalThis.__DATOS_DEMO) return { data: globalThis.__DATOS_DEMO, fuente: 'local', motivo };
    const resp = await fetch(RUTA_DEMO);
    if (!resp.ok) throw new Error(`No se encontró ${RUTA_DEMO} ni hay datos de ejemplo embebidos.`);
    return { data: await resp.json(), fuente: 'local', motivo };
  };

  /** Pide el dataset al Apps Script. Lanza un error explicativo si algo falla. */
  const traerRemoto = async (segundos) => {
    const corte = AbortSignal.timeout ? AbortSignal.timeout(segundos * 1000) : undefined;
    let resp;
    try {
      resp = await fetch(`${API_URL}?action=getAll`, { redirect: 'follow', signal: corte });
    } catch (err) {
      throw new Error(err.name === 'TimeoutError'
        ? `El Apps Script no respondió en ${segundos} segundos.`
        : 'No se pudo conectar con el Apps Script. Puede estar sin desplegar o sin permisos de acceso público.');
    }
    const texto = await resp.text();
    let datos;
    try {
      datos = JSON.parse(texto);
    } catch {
      throw new Error('El Apps Script no devolvió datos. Suele significar que falta pegar Code.gs, o que la implementación no está en "Ejecutar como: Yo" y "Acceso: Cualquier persona".');
    }
    if (!datos.ok) throw new Error(datos.error || 'El Apps Script devolvió un error.');
    if (!datos.data || !Array.isArray(datos.data.Productos) || !datos.data.Productos.length) {
      throw new Error('El Apps Script respondió, pero el Sheets está vacío. Falta ejecutar bootstrap() desde el editor.');
    }
    conexion.fuente = 'remoto';
    conexion.motivo = null;
    return { data: datos.data, fuente: 'remoto', motivo: null };
  };

  /**
   * Trae el dataset completo. Una sola llamada al arrancar.
   *
   * En modo 'auto' intenta el backend y cae a los datos de ejemplo si no responde,
   * guardando el motivo para poder mostrarlo en pantalla. Así la aplicación abre
   * siempre, y el día que el Apps Script quede desplegado pasa a datos reales sola.
   */
  const traerTodo = async () => {
    if (MODO_DATOS === 'local') return traerDemo('Modo de datos de ejemplo forzado en la configuración.');
    if (MODO_DATOS === 'remoto') return traerRemoto(ESPERA_BACKEND);
    try {
      return await traerRemoto(ESPERA_BACKEND);
    } catch (err) {
      return traerDemo(err.message);
    }
  };

  const guardar = (tab, rows, origen = 'app') => {
    if (!hayBackend()) {
      return Promise.reject(new Error(`No hay conexión con el Apps Script, así que el cambio no se puede guardar. ${conexion.motivo || ''}`.trim()));
    }
    return postear({ action: 'upsert', tab, rows, origen });
  };

  const eliminar = (tab, keys, origen = 'app') => postear({ action: 'remove', tab, keys, origen });

  const registrar = (evento) => postear({ action: 'log', ...evento });

  const guardarSnapshot = (rows) => postear({ action: 'snapshot', rows });

  const urlLogsCsv = (desde, hasta) => {
    const p = new URLSearchParams({ action: 'exportLogs' });
    if (desde) p.set('desde', desde);
    if (hasta) p.set('hasta', hasta);
    return `${API_URL}?${p.toString()}`;
  };

  const traerLogs = async () => {
    if (!hayBackend()) return [];
    const resp = await fetch(`${API_URL}?action=getTab&tab=Logs`, { redirect: 'follow' });
    const datos = await resp.json();
    return datos.ok ? datos.rows : [];
  };

  __exp['API_URL'] = API_URL;
  __exp['WRITE_TOKEN'] = WRITE_TOKEN;
  __exp['MODO_DATOS'] = MODO_DATOS;
  __exp['USAR_DATOS_LOCALES'] = USAR_DATOS_LOCALES;
  __exp['conexion'] = conexion;
  __exp['hayBackend'] = hayBackend;
  __exp['traerTodo'] = traerTodo;
  __exp['guardar'] = guardar;
  __exp['eliminar'] = eliminar;
  __exp['registrar'] = registrar;
  __exp['guardarSnapshot'] = guardarSnapshot;
  __exp['urlLogsCsv'] = urlLogsCsv;
  __exp['traerLogs'] = traerLogs;
  return __exp;
});

__def('data/store.js', (__req) => {
  const __exp = {};
  /**
   * store.js — estado de la aplicación en memoria.
   *
   * El dataset entero entra una vez y se queda acá. Recalcular las ~1.200
   * combinaciones de producto x marketplace x modalidad tarda milisegundos, así
   * que cada vez que se toca un precio o un parámetro se recalcula todo de nuevo
   * en lugar de intentar invalidar selectivamente. Más simple y sin riesgo de
   * mostrar un número viejo.
   */

  const { traerTodo, guardar } = __req('data/api.js');
  const { calcularRentabilidad, precioSugeridoModalidad, precioParaMargen, CONTADO } = __req('core/engine.js');
  const estado = {
    cargado: false,
    fuente: null,
    motivo: null,
    horaCarga: null,
    raw: null,
    cfg: null,
    tarifas: {},
    productos: [],
    productoMarketplace: [],
    publicaciones: [],
    marketplaces: [],
    resultados: [],
    indices: { producto: new Map(), pm: new Map() },
  };

  const suscriptores = new Set();
  const suscribir = (fn) => { suscriptores.add(fn); return () => suscriptores.delete(fn); };
  const notificar = () => suscriptores.forEach((fn) => fn(estado));

  const nro = (v) => {
    if (typeof v === 'number') return v;
    if (v === '' || v === null || v === undefined) return 0;
    const n = parseFloat(String(v).replace(',', '.'));
    return Number.isFinite(n) ? n : 0;
  };
  const bool = (v) => v === true || v === 'true' || v === 'TRUE' || v === 1;

  /** Arma el objeto de configuración que consume el motor. */
  const normalizar = (data) => {
    const plano = {};
    (data.Config || []).forEach((c) => { plano[c.clave] = c.valor; });

    const marketplaces = {};
    (data.Marketplaces || []).forEach((m) => {
      marketplaces[m.id] = {
        comisionPctDefault: nro(m.comision_pct_default),
        umbralEnvio: nro(m.umbral_envio),
        procesamientoPagosPct: nro(m.procesamiento_pagos_pct),
      };
    });

    const financiacion = {};
    (data.Financiacion || []).forEach((f) => {
      const mp = String(f.marketplace_id);
      (financiacion[mp] ||= {})[nro(f.cuotas)] = {
        costo_real: nro(f.costo_real),
        markup: nro(f.markup),
      };
    });

    const tarifas = {};
    [...(data.TarifasLogistica || []), ...(data.TarifasComisionFija || [])].forEach((t) => {
      (tarifas[t.tabla] ||= []).push({
        peso_min: nro(t.peso_min), peso_max: nro(t.peso_max),
        precio_min: nro(t.precio_min), precio_max: nro(t.precio_max),
        valor_c_iva: nro(t.valor_c_iva), vigencia_desde: t.vigencia_desde,
      });
    });

    return {
      cfg: {
        iva: nro(plano.IVA) || 0.21,
        tc: nro(plano.TIPO_CAMBIO),
        divisorVolumetrico: nro(plano.DIVISOR_VOLUMETRICO) || 4000,
        iibbPct: nro(plano.IIBB_PCT),
        impDebCredPct: nro(plano.IMP_DEB_CRED_PCT),
        marketplaces,
        financiacion,
      },
      tarifas,
    };
  };

  const cargar = async () => {
    const { data, fuente, motivo } = await traerTodo();
    const { cfg, tarifas } = normalizar(data);

    estado.raw = data;
    estado.cfg = cfg;
    estado.tarifas = tarifas;
    estado.marketplaces = (data.Marketplaces || []).slice()
      .sort((a, b) => nro(a.orden) - nro(b.orden));
    estado.productos = (data.Productos || []).map((p) => ({
      ...p,
      sku: String(p.sku),
      costo_usd: nro(p.costo_usd), peso_real: nro(p.peso_real),
      alto: nro(p.alto), ancho: nro(p.ancho), largo: nro(p.largo),
    }));
    estado.productoMarketplace = (data.ProductoMarketplace || []).map((x) => ({
      ...x,
      sku: String(x.sku),
      comision_pct: nro(x.comision_pct), publicidad_pct: nro(x.publicidad_pct),
      varios_pct: nro(x.varios_pct), peso_real: nro(x.peso_real),
      alto: nro(x.alto), ancho: nro(x.ancho), largo: nro(x.largo),
      peso_volumetrico_manual: nro(x.peso_volumetrico_manual),
      envio_me1_manual_c_iva: nro(x.envio_me1_manual_c_iva),
      activo: x.activo === '' ? true : bool(x.activo),
    }));
    estado.publicaciones = (data.Publicaciones || []).map((p) => ({
      ...p, sku: String(p.sku), pvp_c_iva: nro(p.pvp_c_iva),
    }));

    estado.indices.producto = new Map(estado.productos.map((p) => [p.sku, p]));
    estado.indices.pm = new Map(estado.productoMarketplace.map((x) => [`${x.sku}|${x.marketplace_id}`, x]));

    estado.cargado = true;
    estado.fuente = fuente;
    estado.motivo = motivo || null;
    estado.horaCarga = new Date();
    recalcular();
    return estado;
  };

  /** Recalcula todas las publicaciones activas. */
  const recalcular = () => {
    const salida = [];
    estado.publicaciones.forEach((pub) => {
      if (pub.estado === 'INACTIVA') return;
      const producto = estado.indices.producto.get(pub.sku);
      const pm = estado.indices.pm.get(`${pub.sku}|${pub.marketplace_id}`);
      if (!producto || !pm || pm.activo === false) return;
      if (producto.estado === 'INACTIVO') return;
      salida.push({
        ...calcularRentabilidad({
          producto, pm,
          marketplaceId: pub.marketplace_id,
          modalidad: pub.modalidad,
          pvpConIva: pub.pvp_c_iva,
          cfg: estado.cfg, tarifas: estado.tarifas,
        }),
        descripcion: producto.descripcion,
        marca: producto.marca,
        categoria: producto.categoria,
      });
    });
    estado.resultados = salida;
    notificar();
    return salida;
  };

  /** Rentabilidad puntual, sin persistir. Para simular precios en la UI. */
  const simular = ({ sku, marketplaceId, modalidad = CONTADO, pvpConIva }) => {
    const producto = estado.indices.producto.get(String(sku));
    const pm = estado.indices.pm.get(`${sku}|${marketplaceId}`);
    if (!producto || !pm) return null;
    return calcularRentabilidad({
      producto, pm, marketplaceId, modalidad, pvpConIva,
      cfg: estado.cfg, tarifas: estado.tarifas,
    });
  };

  const precioSugerido = (marketplaceId, modalidad, pvpContado) =>
    precioSugeridoModalidad({ pvpContado, cfg: estado.cfg, marketplaceId, modalidad });

  const precioObjetivo = ({ sku, marketplaceId, modalidad, margenObjetivo }) => {
    const producto = estado.indices.producto.get(String(sku));
    const pm = estado.indices.pm.get(`${sku}|${marketplaceId}`);
    if (!producto || !pm) return null;
    return precioParaMargen({
      producto, pm, marketplaceId, modalidad, margenObjetivo,
      cfg: estado.cfg, tarifas: estado.tarifas,
    });
  };

  /** Modalidades disponibles según la financiación cargada. */
  const modalidades = (marketplaceId) => {
    const cuotas = Object.keys(estado.cfg?.financiacion?.[marketplaceId] || {})
      .map(Number).filter((n) => n > 1).sort((a, b) => a - b);
    return [CONTADO, ...cuotas];
  };

  /**
   * Guarda y actualiza el estado local. Si el backend falla, no se toca nada:
   * mejor un error visible que una pantalla que miente sobre lo que se guardó.
   */
  const persistir = async (tab, filas) => {
    await guardar(tab, filas);
    // Los datos de catálogo se parchean en memoria, que es barato. Cambiar un
    // parámetro o una tarifa afecta a todo, así que en ese caso se recarga entero.
    const coleccion = {
      Productos: 'productos',
      ProductoMarketplace: 'productoMarketplace',
      Publicaciones: 'publicaciones',
    }[tab];
    if (!coleccion) {
      await cargar();
      return;
    }
    {
      filas.forEach((nueva) => {
        const clave = tab === 'Productos' ? ['sku']
          : tab === 'ProductoMarketplace' ? ['sku', 'marketplace_id']
            : ['sku', 'marketplace_id', 'modalidad'];
        const idx = estado[coleccion].findIndex((f) =>
          clave.every((c) => String(f[c]) === String(nueva[c])));
        if (idx >= 0) Object.assign(estado[coleccion][idx], nueva);
        else estado[coleccion].push({ ...nueva });
      });
      estado.indices.producto = new Map(estado.productos.map((p) => [String(p.sku), p]));
      estado.indices.pm = new Map(estado.productoMarketplace.map((x) => [`${x.sku}|${x.marketplace_id}`, x]));
    }
    recalcular();
  };

  const obtener = () => estado;

  __exp['suscribir'] = suscribir;
  __exp['cargar'] = cargar;
  __exp['recalcular'] = recalcular;
  __exp['simular'] = simular;
  __exp['precioSugerido'] = precioSugerido;
  __exp['precioObjetivo'] = precioObjetivo;
  __exp['modalidades'] = modalidades;
  __exp['persistir'] = persistir;
  __exp['obtener'] = obtener;
  __exp['CONTADO'] = CONTADO;
  return __exp;
});

__def('ui/format.js', (__req) => {
  const __exp = {};
  /**
   * format.js — presentación de números y el componente de margen.
   *
   * Todos los importes se muestran en pesos sin decimales: en esta escala los
   * centavos son ruido, y quitarlos deja las columnas más cortas y más fáciles de
   * barrer con la vista.
   */

  const fmtPesos = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
  const fmtDec = new Intl.NumberFormat('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  const pesos = (v) =>
    v === null || v === undefined || Number.isNaN(v) ? '—' : fmtPesos.format(Math.round(v));

  const pesosFirmado = (v) => {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    const s = fmtPesos.format(Math.abs(Math.round(v)));
    return v < 0 ? `−${s}` : s;
  };

  const porcentaje = (v, dec = 1) =>
    v === null || v === undefined || Number.isNaN(v) ? '—' : `${(v * 100).toFixed(dec)}%`;

  const kilos = (v) =>
    v === null || v === undefined ? '—' : `${fmtDec.format(v)} kg`;

  const etiquetaModalidad = (m) =>
    String(m).toUpperCase() === 'CONTADO' ? 'Contado' : `${m} cuotas`;

  const escapar = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /**
   * BARRA DE MARGEN — el elemento central de la interfaz.
   *
   * El margen se dibuja como una barra anclada en una línea de cero central: crece
   * hacia la derecha si hay ganancia y hacia la izquierda si hay pérdida. Al
   * recorrer una columna de márgenes, las pérdidas sobresalen hacia el lado
   * contrario y se ven sin leer un solo número.
   *
   * No hay umbrales de color intermedios a propósito: el único corte que importa
   * en este negocio es el cero, así que la línea del cero es la regla.
   *
   * La escala se satura en ±40%: por encima de eso la diferencia entre 45% y 60%
   * no cambia ninguna decisión, y comprimir la escala haría ilegibles los márgenes
   * chicos, que son justamente los que hay que vigilar.
   */
  const barraMargen = (margen) => {
    if (margen === null || margen === undefined || Number.isNaN(margen)) {
      return '<span class="margen margen--vacio">—</span>';
    }
    const tope = 0.4;
    const ancho = Math.min(Math.abs(margen) / tope, 1) * 50;
    const negativo = margen < 0;
    const clase = negativo ? 'margen--perdida' : 'margen--ganancia';
    const barra = negativo
      ? `left:${50 - ancho}%;width:${ancho}%`
      : `left:50%;width:${ancho}%`;
    return `<span class="margen ${clase}">
      <span class="margen__pista"><span class="margen__barra" style="${barra}"></span></span>
      <span class="margen__valor">${porcentaje(margen)}</span>
    </span>`;
  };

  /** Chip de régimen logístico, para explicar de dónde sale el costo de envío. */
  const chipRegimen = (regimen) => {
    const textos = {
      ENVIO_GRATIS: ['Envío', 'Absorbemos el envío porque el precio supera el umbral'],
      CARGO_FIJO: ['Cargo fijo', 'Bajo el umbral: ML cobra cargo fijo y no pagamos envío'],
      ME1: ['ME1', 'Envío por fuera de la logística del marketplace, importe manual'],
      FEE_LOGISTICO: ['Fee', 'Fee logístico por escalón de peso'],
      SIN_LOGISTICA: ['—', 'Sin costo logístico definido'],
      INDETERMINADO: ['Sin datos', 'Falta peso o medidas para resolver la tarifa'],
    };
    const [txt, ayuda] = textos[regimen] || [regimen, ''];
    const alerta = regimen === 'INDETERMINADO' ? ' chip--alerta' : '';
    return `<span class="chip${alerta}" title="${escapar(ayuda)}">${escapar(txt)}</span>`;
  };

  const chipMarketplace = (id) =>
    `<span class="chip chip--mp chip--${escapar(String(id).toLowerCase())}">${escapar(id)}</span>`;

  /** Ícono de advertencia con el detalle en el tooltip. */
  const marcaAviso = (avisos) => {
    if (!avisos || !avisos.length) return '';
    return `<span class="aviso" title="${escapar(avisos.join(' · '))}">!</span>`;
  };

  __exp['pesos'] = pesos;
  __exp['pesosFirmado'] = pesosFirmado;
  __exp['porcentaje'] = porcentaje;
  __exp['kilos'] = kilos;
  __exp['etiquetaModalidad'] = etiquetaModalidad;
  __exp['escapar'] = escapar;
  __exp['barraMargen'] = barraMargen;
  __exp['chipRegimen'] = chipRegimen;
  __exp['chipMarketplace'] = chipMarketplace;
  __exp['marcaAviso'] = marcaAviso;
  return __exp;
});

__def('ui/componentes.js', (__req) => {
  const __exp = {};
  /**
   * componentes.js — piezas de interfaz compartidas.
   *
   * La tabla es la pieza más usada del sistema: cinco pantallas la reutilizan con
   * distintas columnas. Ordena en memoria, sin volver al servidor.
   */

  const { escapar } = __req('ui/format.js');
  /**
   * Tabla ordenable.
   *
   * @param columnas [{ clave, titulo, alinear, ancho, render, valor, ayuda }]
   *   - render(fila) devuelve HTML; valor(fila) devuelve el valor de orden.
   */
  const tabla = (columnas, filas, opciones = {}) => {
    const { ordenPor = null, ordenAsc = false, id = 'tabla', vacio = 'No hay datos para mostrar.' } = opciones;

    if (!filas.length) {
      return `<div class="vacio">${escapar(vacio)}</div>`;
    }

    const ordenadas = [...filas];
    if (ordenPor) {
      const col = columnas.find((c) => c.clave === ordenPor);
      if (col) {
        const valor = col.valor || ((f) => f[col.clave]);
        ordenadas.sort((a, b) => {
          const va = valor(a); const vb = valor(b);
          if (va === null || va === undefined) return 1;
          if (vb === null || vb === undefined) return -1;
          if (typeof va === 'number' && typeof vb === 'number') return ordenAsc ? va - vb : vb - va;
          return ordenAsc
            ? String(va).localeCompare(String(vb), 'es')
            : String(vb).localeCompare(String(va), 'es');
        });
      }
    }

    const encabezado = columnas.map((c) => {
      const activo = c.clave === ordenPor;
      const flecha = activo ? (ordenAsc ? ' ↑' : ' ↓') : '';
      const estilo = c.ancho ? ` style="width:${c.ancho}"` : '';
      return `<th class="${c.alinear === 'der' ? 'der' : ''}${activo ? ' activo' : ''}"${estilo}
        data-orden="${escapar(c.clave)}" data-tabla="${escapar(id)}"
        ${c.ayuda ? `title="${escapar(c.ayuda)}"` : ''}>${escapar(c.titulo)}${flecha}</th>`;
    }).join('');

    const cuerpo = ordenadas.map((f) => {
      const clases = [f._clase || ''].filter(Boolean).join(' ');
      const celdas = columnas.map((c) => {
        const contenido = c.render ? c.render(f) : escapar(f[c.clave] ?? '');
        return `<td class="${c.alinear === 'der' ? 'der' : ''}${c.mono ? ' mono' : ''}">${contenido}</td>`;
      }).join('');
      return `<tr class="${clases}">${celdas}</tr>`;
    }).join('');

    return `<div class="tabla-scroll"><table class="tabla">
      <thead><tr>${encabezado}</tr></thead><tbody>${cuerpo}</tbody></table></div>`;
  };

  /** Conecta el click en los encabezados. Se llama una vez por render de vista. */
  const activarOrden = (contenedor, estadoOrden, volverARenderizar) => {
    contenedor.querySelectorAll('th[data-orden]').forEach((th) => {
      th.addEventListener('click', () => {
        const clave = th.dataset.orden;
        const id = th.dataset.tabla;
        const actual = estadoOrden[id] || {};
        estadoOrden[id] = {
          ordenPor: clave,
          ordenAsc: actual.ordenPor === clave ? !actual.ordenAsc : false,
        };
        volverARenderizar();
      });
    });
  };

  /** Fila de indicadores del encabezado de cada pantalla. */
  const indicadores = (items) => `<div class="indicadores">${items.map((i) => `
    <div class="indicador${i.alerta ? ' indicador--alerta' : ''}">
      <span class="indicador__etiqueta">${escapar(i.etiqueta)}</span>
      <span class="indicador__valor">${i.valor}</span>
      ${i.pie ? `<span class="indicador__pie">${escapar(i.pie)}</span>` : ''}
    </div>`).join('')}</div>`;

  const buscador = (valor, marcador = 'Buscar por SKU o producto') =>
    `<input type="search" class="buscador" id="buscador" value="${escapar(valor)}"
      placeholder="${escapar(marcador)}" autocomplete="off">`;

  const selector = (id, opciones, valor, etiqueta) => `
    <label class="campo-inline">
      ${etiqueta ? `<span>${escapar(etiqueta)}</span>` : ''}
      <select id="${escapar(id)}">
        ${opciones.map((o) => `<option value="${escapar(o.valor)}"${String(o.valor) === String(valor) ? ' selected' : ''}>${escapar(o.texto)}</option>`).join('')}
      </select>
    </label>`;

  const aviso = (texto, tipo = 'info') =>
    `<div class="nota nota--${tipo}">${texto}</div>`;

  /** Mensaje flotante. Desaparece solo; los errores se quedan hasta que se cierran. */
  const notificar = (texto, tipo = 'ok') => {
    let cont = document.getElementById('notificaciones');
    if (!cont) {
      cont = document.createElement('div');
      cont.id = 'notificaciones';
      document.body.appendChild(cont);
    }
    const el = document.createElement('div');
    el.className = `notificacion notificacion--${tipo}`;
    el.innerHTML = `<span>${escapar(texto)}</span><button aria-label="Cerrar">×</button>`;
    el.querySelector('button').addEventListener('click', () => el.remove());
    cont.appendChild(el);
    if (tipo !== 'error') setTimeout(() => el.remove(), 4000);
  };

  /** Panel lateral para editar un registro. */
  const panel = (titulo, contenidoHtml, alGuardar) => {
    const fondo = document.createElement('div');
    fondo.className = 'panel-fondo';
    fondo.innerHTML = `<aside class="panel" role="dialog" aria-label="${escapar(titulo)}">
      <header class="panel__cabecera">
        <h2>${escapar(titulo)}</h2>
        <button class="panel__cerrar" aria-label="Cerrar">×</button>
      </header>
      <div class="panel__cuerpo">${contenidoHtml}</div>
      <footer class="panel__pie">
        <button class="btn btn--fantasma" data-accion="cancelar">Cancelar</button>
        <button class="btn btn--primario" data-accion="guardar">Guardar cambios</button>
      </footer>
    </aside>`;
    const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', escape); };
    const escape = (e) => { if (e.key === 'Escape') cerrar(); };
    fondo.querySelector('.panel__cerrar').addEventListener('click', cerrar);
    fondo.querySelector('[data-accion="cancelar"]').addEventListener('click', cerrar);
    fondo.addEventListener('click', (e) => { if (e.target === fondo) cerrar(); });
    document.addEventListener('keydown', escape);
    fondo.querySelector('[data-accion="guardar"]').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      btn.textContent = 'Guardando…';
      try {
        await alGuardar(fondo.querySelector('.panel__cuerpo'));
        cerrar();
      } catch (err) {
        notificar(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Guardar cambios';
      }
    });
    document.body.appendChild(fondo);
    const primero = fondo.querySelector('input, select');
    if (primero) primero.focus();
    return fondo;
  };

  const campo = (etiqueta, nombre, valor, opciones = {}) => {
    const { tipo = 'number', paso = 'any', ayuda = '', sufijo = '', opcionesSelect = null } = opciones;
    const control = opcionesSelect
      ? `<select name="${escapar(nombre)}">${opcionesSelect.map((o) =>
        `<option value="${escapar(o.valor)}"${String(o.valor) === String(valor) ? ' selected' : ''}>${escapar(o.texto)}</option>`).join('')}</select>`
      : `<input type="${tipo}" name="${escapar(nombre)}" value="${escapar(valor)}" step="${escapar(paso)}">`;
    return `<label class="campo">
      <span class="campo__etiqueta">${escapar(etiqueta)}${sufijo ? ` <em>${escapar(sufijo)}</em>` : ''}</span>
      ${control}
      ${ayuda ? `<span class="campo__ayuda">${escapar(ayuda)}</span>` : ''}
    </label>`;
  };

  const leerCampos = (cuerpo) => {
    const datos = {};
    cuerpo.querySelectorAll('input[name], select[name]').forEach((el) => {
      datos[el.name] = el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value;
    });
    return datos;
  };

  /** Descarga un CSV generado en el navegador. */
  const descargarCsv = (nombre, encabezados, filas) => {
    const esc = (v) => {
      const s = String(v ?? '');
      return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const texto = [encabezados.join(';'), ...filas.map((f) => f.map(esc).join(';'))].join('\n');
    const url = URL.createObjectURL(new Blob([`\uFEFF${texto}`], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    a.click();
    URL.revokeObjectURL(url);
  };

  __exp['tabla'] = tabla;
  __exp['activarOrden'] = activarOrden;
  __exp['indicadores'] = indicadores;
  __exp['buscador'] = buscador;
  __exp['selector'] = selector;
  __exp['aviso'] = aviso;
  __exp['notificar'] = notificar;
  __exp['panel'] = panel;
  __exp['campo'] = campo;
  __exp['leerCampos'] = leerCampos;
  __exp['descargarCsv'] = descargarCsv;
  return __exp;
});

__def('ui/views/dashboard.js', (__req) => {
  const __exp = {};
  /**
   * Dashboard — la primera pantalla. Su único trabajo es responder "¿hay algo que
   * esté perdiendo plata ahora mismo?" antes de que haya que buscarlo.
   */

  const { obtener } = __req('data/store.js');
  const { pesos, pesosFirmado, porcentaje, barraMargen, chipMarketplace, etiquetaModalidad, escapar } = __req('ui/format.js');
  const { tabla, indicadores, activarOrden } = __req('ui/componentes.js');
  const orden = {};

  const titulo = 'Panel general';

  const render = () => {
    const { resultados, productos, marketplaces, cfg, publicaciones } = obtener();
    const contado = resultados.filter((r) => r.modalidad === 'CONTADO');
    const perdidas = resultados.filter((r) => r.negativo);
    const conAvisos = resultados.filter((r) => r.advertencias.length);

    const margenPromedio = contado.length
      ? contado.reduce((s, r) => s + (r.margenSobreFacturacionNeta ?? 0), 0) / contado.length
      : null;
    const utilidadTotal = contado.reduce((s, r) => s + r.utilidad, 0);

    // Brecha entre marketplaces: mismo producto, misma modalidad, márgenes muy
    // distintos. Suele significar un precio desalineado, no un costo distinto.
    const porSku = new Map();
    contado.forEach((r) => {
      if (!porSku.has(r.sku)) porSku.set(r.sku, []);
      porSku.get(r.sku).push(r);
    });
    const brechas = [];
    porSku.forEach((lista, sku) => {
      if (lista.length < 2) return;
      const margenes = lista.map((r) => r.margenSobreFacturacionNeta ?? 0);
      const brecha = Math.max(...margenes) - Math.min(...margenes);
      if (brecha >= 0.08) {
        const mejor = lista.reduce((a, b) => ((a.margenSobreFacturacionNeta ?? 0) > (b.margenSobreFacturacionNeta ?? 0) ? a : b));
        const peor = lista.reduce((a, b) => ((a.margenSobreFacturacionNeta ?? 0) < (b.margenSobreFacturacionNeta ?? 0) ? a : b));
        brechas.push({ sku, descripcion: lista[0].descripcion, brecha, mejor, peor });
      }
    });

    const colsPerdidas = [
      { clave: 'sku', titulo: 'SKU', mono: true, ancho: '76px' },
      { clave: 'descripcion', titulo: 'Producto', render: (f) => escapar(f.descripcion || '') },
      { clave: 'marketplaceId', titulo: 'Canal', ancho: '96px', render: (f) => chipMarketplace(f.marketplaceId) },
      { clave: 'modalidad', titulo: 'Modalidad', ancho: '96px', render: (f) => escapar(etiquetaModalidad(f.modalidad)) },
      { clave: 'pvpConIva', titulo: 'PVP c/IVA', alinear: 'der', mono: true, render: (f) => pesos(f.pvpConIva) },
      { clave: 'utilidad', titulo: 'Utilidad', alinear: 'der', mono: true, render: (f) => `<span class="cifra-perdida">${pesosFirmado(f.utilidad)}</span>` },
      { clave: 'margenSobreFacturacionNeta', titulo: 'Margen', ancho: '160px', render: (f) => barraMargen(f.margenSobreFacturacionNeta) },
    ];

    const colsBrechas = [
      { clave: 'sku', titulo: 'SKU', mono: true, ancho: '76px' },
      { clave: 'descripcion', titulo: 'Producto', render: (f) => escapar(f.descripcion || '') },
      {
        clave: 'peor',
        titulo: 'Peor canal',
        render: (f) => `${chipMarketplace(f.peor.marketplaceId)} <span class="mono tenue">${porcentaje(f.peor.margenSobreFacturacionNeta)}</span>`,
        valor: (f) => f.peor.margenSobreFacturacionNeta,
      },
      {
        clave: 'mejor',
        titulo: 'Mejor canal',
        render: (f) => `${chipMarketplace(f.mejor.marketplaceId)} <span class="mono tenue">${porcentaje(f.mejor.margenSobreFacturacionNeta)}</span>`,
        valor: (f) => f.mejor.margenSobreFacturacionNeta,
      },
      { clave: 'brecha', titulo: 'Diferencia', alinear: 'der', mono: true, render: (f) => `${(f.brecha * 100).toFixed(1)} pts` },
    ];

    return `
      ${indicadores([
        { etiqueta: 'Productos activos', valor: String(productos.filter((p) => p.estado !== 'INACTIVO').length), pie: `${publicaciones.length} publicaciones` },
        { etiqueta: 'Canales', valor: String(marketplaces.filter((m) => m.activo === true || m.activo === 'true').length), pie: `de ${marketplaces.length} configurados` },
        { etiqueta: 'Margen promedio', valor: porcentaje(margenPromedio), pie: 'contado, sobre facturación neta' },
        { etiqueta: 'Utilidad por unidad', valor: pesos(utilidadTotal), pie: 'suma de todo el catálogo en contado' },
        { etiqueta: 'En pérdida', valor: String(perdidas.length), pie: perdidas.length ? 'requieren acción' : 'nada por revisar', alerta: perdidas.length > 0 },
      ])}

      <section class="bloque">
        <header class="bloque__cabecera">
          <h2>Publicaciones en pérdida</h2>
          <p>Vendiendo estas unidades se pierde plata al precio actual. Es el único umbral que el sistema marca en rojo.</p>
        </header>
        ${tabla(colsPerdidas, perdidas, {
          id: 'perdidas',
          ...(orden.perdidas || { ordenPor: 'margenSobreFacturacionNeta', ordenAsc: true }),
          vacio: 'Ninguna publicación está en pérdida. Buen momento para revisar precios al alza.',
        })}
      </section>

      <section class="bloque">
        <header class="bloque__cabecera">
          <h2>Diferencias entre canales</h2>
          <p>Mismo producto, misma modalidad, más de 8 puntos de margen de diferencia. Casi siempre es un precio desalineado, no un costo distinto.</p>
        </header>
        ${tabla(colsBrechas, brechas, {
          id: 'brechas',
          ...(orden.brechas || { ordenPor: 'brecha', ordenAsc: false }),
          vacio: 'Los márgenes están alineados entre canales.',
        })}
      </section>

      ${conAvisos.length ? `
      <section class="bloque">
        <header class="bloque__cabecera">
          <h2>Datos incompletos</h2>
          <p>Estas publicaciones se calculan con información faltante, así que el margen que muestran no es confiable.</p>
        </header>
        <ul class="lista-avisos">
          ${[...new Set(conAvisos.map((r) => `${r.sku}|${r.marketplaceId}|${r.advertencias.join(' · ')}`))]
      .map((linea) => {
        const [sku, mp, texto] = linea.split('|');
        return `<li><span class="mono">${escapar(sku)}</span> ${chipMarketplace(mp)} ${escapar(texto)}</li>`;
      }).join('')}
        </ul>
      </section>` : ''}

      <p class="pie-nota">
        Tipo de cambio ${pesos(cfg.tc)} · IVA ${porcentaje(cfg.iva, 0)} ·
        IIBB ${porcentaje(cfg.iibbPct, 0)} y débito/crédito ${porcentaje(cfg.impDebCredPct, 1)} sobre el precio con IVA.
      </p>`;
  };

  const activar = (contenedor, refrescar) => activarOrden(contenedor, orden, refrescar);

  __exp['titulo'] = titulo;
  __exp['render'] = render;
  __exp['activar'] = activar;
  return __exp;
});

__def('ui/views/rentabilidad.js', (__req) => {
  const __exp = {};
  /**
   * Rentabilidad por canal — una pantalla por marketplace, con el desglose
   * completo de costos y el precio editable en línea.
   *
   * En MercadoLibre se listan todas las publicaciones del mismo producto (una por
   * modalidad de cuotas). En los demás canales hay un precio único, así que se
   * muestran las modalidades habilitadas calculadas sobre ese mismo precio.
   */

  const { obtener, persistir, simular, precioSugerido, precioObjetivo, modalidades } = __req('data/store.js');
  const {
    pesos, pesosFirmado, porcentaje, kilos, barraMargen, chipRegimen,
    etiquetaModalidad, marcaAviso, escapar,
  } = __req('ui/format.js');
  const { tabla, indicadores, activarOrden, buscador, selector, panel, campo, leerCampos, notificar, descargarCsv } = __req('ui/componentes.js');
  const orden = {};
  const filtro = { texto: '', modalidad: 'TODAS' };

  let marketplaceActual = 'ML';
  const fijarMarketplace = (id) => { marketplaceActual = id; };
  const titulo = () => {
    const mp = obtener().marketplaces.find((m) => m.id === marketplaceActual);
    return mp ? `Rentabilidad · ${mp.nombre}` : 'Rentabilidad';
  };

  /** Filas a mostrar: publicaciones reales más las modalidades derivadas. */
  const armarFilas = () => {
    const { resultados, publicaciones, marketplaces } = obtener();
    const mpDef = marketplaces.find((m) => m.id === marketplaceActual) || {};
    const variantes = mpDef.soporta_variantes_cuotas === true || mpDef.soporta_variantes_cuotas === 'true';
    const propias = resultados.filter((r) => r.marketplaceId === marketplaceActual);

    if (variantes) return propias.map((r) => ({ ...r, derivada: false }));

    // Precio único: se proyectan las modalidades habilitadas sobre el mismo precio.
    const filas = [];
    propias.forEach((r) => {
      filas.push({ ...r, derivada: false });
      if (r.modalidad !== 'CONTADO') return;
      modalidades(marketplaceActual).filter((m) => m !== 'CONTADO').forEach((cuotas) => {
        const pub = publicaciones.find((p) => p.sku === r.sku && p.marketplace_id === marketplaceActual && String(p.modalidad) === String(cuotas));
        if (pub) return;
        const sim = simular({ sku: r.sku, marketplaceId: marketplaceActual, modalidad: cuotas, pvpConIva: r.pvpConIva });
        if (sim) filas.push({ ...sim, descripcion: r.descripcion, marca: r.marca, categoria: r.categoria, derivada: true });
      });
    });
    return filas;
  };

  const columnas = () => [
    { clave: 'sku', titulo: 'SKU', mono: true, ancho: '74px' },
    {
      clave: 'descripcion',
      titulo: 'Producto',
      render: (f) => `${escapar(f.descripcion || '')}${marcaAviso(f.advertencias)}${f.derivada ? '<span class="chip chip--derivada" title="Modalidad proyectada sobre el precio único de este canal">proyectada</span>' : ''}`,
    },
    { clave: 'modalidad', titulo: 'Modalidad', ancho: '92px', render: (f) => escapar(etiquetaModalidad(f.modalidad)), valor: (f) => (f.modalidad === 'CONTADO' ? 0 : f.modalidad) },
    {
      clave: 'pvpConIva', titulo: 'PVP c/IVA', alinear: 'der', mono: true, ancho: '104px',
      render: (f) => `<button class="celda-editable" data-editar="${escapar(f.sku)}" data-modalidad="${escapar(f.modalidad)}" title="Editar precio">${pesos(f.pvpConIva)}</button>`,
    },
    { clave: 'ingresoNeto', titulo: 'Neto', alinear: 'der', mono: true, ancho: '96px', render: (f) => pesos(f.ingresoNeto), ayuda: 'Precio sin IVA' },
    { clave: 'costoProducto', titulo: 'Costo', alinear: 'der', mono: true, ancho: '96px', render: (f) => pesos(f.costos.costoProducto), valor: (f) => f.costos.costoProducto },
    { clave: 'comision', titulo: 'Comisión', alinear: 'der', mono: true, ancho: '92px', render: (f) => pesos(f.costos.comision), valor: (f) => f.costos.comision, ayuda: 'Costo neto de comisión, ya descontado el IVA recuperable' },
    { clave: 'financiero', titulo: 'Financiación', alinear: 'der', mono: true, ancho: '96px', render: (f) => pesos(f.costos.costoFinanciero), valor: (f) => f.costos.costoFinanciero },
    {
      clave: 'logistica', titulo: 'Logística', alinear: 'der', mono: true, ancho: '96px',
      render: (f) => pesos(f.costos.costoLogistico + f.costos.cargoFijo),
      valor: (f) => f.costos.costoLogistico + f.costos.cargoFijo,
    },
    { clave: 'regimen', titulo: 'Régimen', ancho: '92px', render: (f) => chipRegimen(f.regimenLogistico), valor: (f) => f.regimenLogistico },
    { clave: 'peso', titulo: 'Peso fact.', alinear: 'der', mono: true, ancho: '84px', render: (f) => kilos(f.pesoFacturable), valor: (f) => f.pesoFacturable ?? -1 },
    { clave: 'impuestos', titulo: 'Impuestos', alinear: 'der', mono: true, ancho: '92px', render: (f) => pesos(f.costos.iibb + f.costos.impDebCred), valor: (f) => f.costos.iibb + f.costos.impDebCred, ayuda: 'IIBB más impuesto al débito y crédito, sobre el precio con IVA' },
    { clave: 'gastos', titulo: 'Pub. y varios', alinear: 'der', mono: true, ancho: '96px', render: (f) => pesos(f.costos.publicidad + f.costos.varios), valor: (f) => f.costos.publicidad + f.costos.varios },
    {
      clave: 'utilidad', titulo: 'Utilidad', alinear: 'der', mono: true, ancho: '100px',
      render: (f) => `<span class="${f.negativo ? 'cifra-perdida' : 'cifra-fuerte'}">${pesosFirmado(f.utilidad)}</span>`,
    },
    { clave: 'margenSobreFacturacionNeta', titulo: 'Margen neto', ancho: '150px', render: (f) => barraMargen(f.margenSobreFacturacionNeta) },
    { clave: 'rentabilidadSobreCosto', titulo: 's/costo', alinear: 'der', mono: true, ancho: '78px', render: (f) => porcentaje(f.rentabilidadSobreCosto) },
  ];

  const render = () => {
    const { marketplaces } = obtener();
    const mpDef = marketplaces.find((m) => m.id === marketplaceActual) || {};
    let filas = armarFilas();

    if (filtro.texto) {
      const t = filtro.texto.toLowerCase();
      filas = filas.filter((f) => String(f.sku).includes(t) || String(f.descripcion || '').toLowerCase().includes(t));
    }
    if (filtro.modalidad !== 'TODAS') {
      filas = filas.filter((f) => String(f.modalidad) === filtro.modalidad);
    }

    const contado = filas.filter((f) => f.modalidad === 'CONTADO');
    const perdidas = filas.filter((f) => f.negativo);
    const margenProm = contado.length
      ? contado.reduce((s, f) => s + (f.margenSobreFacturacionNeta ?? 0), 0) / contado.length : null;

    const opcModalidad = [{ valor: 'TODAS', texto: 'Todas las modalidades' },
      ...modalidades(marketplaceActual).map((m) => ({ valor: String(m), texto: etiquetaModalidad(m) }))];

    return `
      ${indicadores([
        { etiqueta: 'Publicaciones', valor: String(filas.length) },
        { etiqueta: 'Margen promedio contado', valor: porcentaje(margenProm) },
        { etiqueta: 'En pérdida', valor: String(perdidas.length), alerta: perdidas.length > 0 },
        { etiqueta: 'Comisión base', valor: porcentaje(Number(mpDef.comision_pct_default) || 0), pie: mpDef.comision_iva_mode === 'incluido' ? 'IVA incluido en la tasa' : 'IVA por fuera' },
      ])}

      <div class="barra-herramientas">
        ${buscador(filtro.texto)}
        ${selector('filtro-modalidad', opcModalidad, filtro.modalidad)}
        <button class="btn btn--fantasma" id="exportar">Descargar CSV</button>
      </div>

      ${mpDef.notas ? `<p class="pie-nota">${escapar(mpDef.notas)}</p>` : ''}

      ${tabla(columnas(), filas, {
        id: 'rent',
        ...(orden.rent || { ordenPor: 'margenSobreFacturacionNeta', ordenAsc: true }),
        vacio: 'No hay publicaciones para este canal con los filtros actuales.',
      })}`;
  };

  const activar = (contenedor, refrescar) => {
    activarOrden(contenedor, orden, refrescar);

    const busc = contenedor.querySelector('#buscador');
    if (busc) {
      busc.addEventListener('input', (e) => {
        filtro.texto = e.target.value;
        refrescar();
        const nuevo = document.querySelector('#buscador');
        if (nuevo) { nuevo.focus(); nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length); }
      });
    }

    const selMod = contenedor.querySelector('#filtro-modalidad');
    if (selMod) selMod.addEventListener('change', (e) => { filtro.modalidad = e.target.value; refrescar(); });

    const exp = contenedor.querySelector('#exportar');
    if (exp) {
      exp.addEventListener('click', () => {
        const filas = armarFilas();
        descargarCsv(`rentabilidad-${marketplaceActual.toLowerCase()}.csv`,
          ['SKU', 'Producto', 'Modalidad', 'PVP c/IVA', 'Neto', 'Costo', 'Comision', 'Financiacion',
            'Logistica', 'Regimen', 'Peso facturable', 'IIBB', 'Deb/Cred', 'Publicidad', 'Varios',
            'Utilidad', 'Margen neto', 'Margen s/costo'],
          filas.map((f) => [f.sku, f.descripcion, etiquetaModalidad(f.modalidad),
            Math.round(f.pvpConIva), Math.round(f.ingresoNeto), Math.round(f.costos.costoProducto),
            Math.round(f.costos.comision), Math.round(f.costos.costoFinanciero),
            Math.round(f.costos.costoLogistico + f.costos.cargoFijo), f.regimenLogistico,
            f.pesoFacturable === null ? '' : f.pesoFacturable.toFixed(3),
            Math.round(f.costos.iibb), Math.round(f.costos.impDebCred),
            Math.round(f.costos.publicidad), Math.round(f.costos.varios),
            Math.round(f.utilidad),
            f.margenSobreFacturacionNeta === null ? '' : (f.margenSobreFacturacionNeta * 100).toFixed(2),
            f.rentabilidadSobreCosto === null ? '' : (f.rentabilidadSobreCosto * 100).toFixed(2)]));
        notificar('CSV descargado.');
      });
    }

    contenedor.querySelectorAll('[data-editar]').forEach((btn) => {
      btn.addEventListener('click', () => abrirEditorPrecio(btn.dataset.editar, btn.dataset.modalidad, refrescar));
    });
  };

  /** Editor de precio con vista previa del margen en vivo. */
  const abrirEditorPrecio = (sku, modalidad, refrescar) => {
    const { publicaciones, resultados } = obtener();
    const actual = resultados.find((r) => r.sku === sku && r.marketplaceId === marketplaceActual && String(r.modalidad) === String(modalidad));
    const contadoPub = publicaciones.find((p) => p.sku === sku && p.marketplace_id === marketplaceActual && p.modalidad === 'CONTADO');
    const sugerido = contadoPub && modalidad !== 'CONTADO'
      ? precioSugerido(marketplaceActual, modalidad, contadoPub.pvp_c_iva) : null;

    const cuerpo = `
      <p class="panel__intro">${escapar(actual?.descripcion || sku)} · ${escapar(etiquetaModalidad(modalidad))}</p>
      ${campo('Precio de venta', 'pvp_c_iva', actual?.pvpConIva ?? 0, { paso: '1', sufijo: 'con IVA' })}
      ${sugerido ? `<p class="campo__ayuda">Sugerido desde el contado: <button type="button" class="enlace" id="usar-sugerido">${pesos(sugerido)}</button></p>` : ''}
      <div id="previa" class="previa"></div>
      <label class="campo">
        <span class="campo__etiqueta">Margen objetivo <em>opcional</em></span>
        <div class="fila-objetivo">
          <input type="number" id="objetivo" step="0.5" placeholder="15" >
          <button type="button" class="btn btn--fantasma" id="calcular-objetivo">Calcular precio</button>
        </div>
        <span class="campo__ayuda">Despeja el precio necesario para ese margen, teniendo en cuenta que cruzar un escalón de tarifa cambia el costo.</span>
      </label>`;

    const p = panel('Editar precio', cuerpo, async (cont) => {
      const datos = leerCampos(cont);
      const pvp = Number(datos.pvp_c_iva);
      if (!(pvp > 0)) throw new Error('El precio tiene que ser mayor a cero.');
      await persistir('Publicaciones', [{
        sku, marketplace_id: marketplaceActual, modalidad, pvp_c_iva: pvp,
        origen: 'manual', estado: 'ACTIVA',
      }]);
      notificar('Precio guardado.');
      refrescar();
    });

    const input = p.querySelector('[name="pvp_c_iva"]');
    const previa = p.querySelector('#previa');
    const pintar = () => {
      const r = simular({ sku, marketplaceId: marketplaceActual, modalidad, pvpConIva: Number(input.value) });
      if (!r) { previa.innerHTML = ''; return; }
      previa.innerHTML = `
        <div class="previa__fila"><span>Ingreso neto</span><b class="mono">${pesos(r.ingresoNeto)}</b></div>
        <div class="previa__fila"><span>Costo del producto</span><b class="mono">${pesos(r.costos.costoProducto)}</b></div>
        <div class="previa__fila"><span>Comisión y financiación</span><b class="mono">${pesos(r.costos.comision + r.costos.costoFinanciero)}</b></div>
        <div class="previa__fila"><span>Logística ${chipRegimen(r.regimenLogistico)}</span><b class="mono">${pesos(r.costos.costoLogistico + r.costos.cargoFijo)}</b></div>
        <div class="previa__fila"><span>Impuestos y gastos</span><b class="mono">${pesos(r.costos.iibb + r.costos.impDebCred + r.costos.publicidad + r.costos.varios)}</b></div>
        <div class="previa__fila previa__fila--total"><span>Utilidad</span><b class="mono ${r.negativo ? 'cifra-perdida' : 'cifra-fuerte'}">${pesosFirmado(r.utilidad)}</b></div>
        <div class="previa__margen">${barraMargen(r.margenSobreFacturacionNeta)}</div>`;
    };
    input.addEventListener('input', pintar);
    pintar();

    const usar = p.querySelector('#usar-sugerido');
    if (usar) usar.addEventListener('click', () => { input.value = Math.round(sugerido); pintar(); });

    p.querySelector('#calcular-objetivo').addEventListener('click', () => {
      const objetivo = Number(p.querySelector('#objetivo').value) / 100;
      if (!Number.isFinite(objetivo)) { notificar('Escribí un margen objetivo, por ejemplo 15.', 'error'); return; }
      const res = precioObjetivo({ sku, marketplaceId: marketplaceActual, modalidad, margenObjetivo: objetivo });
      if (!res || !res.convergio) { notificar('No se pudo despejar un precio para ese margen.', 'error'); return; }
      input.value = Math.round(res.pvpConIva);
      pintar();
    });
  };

  __exp['marketplaceActual'] = marketplaceActual;
  __exp['fijarMarketplace'] = fijarMarketplace;
  __exp['titulo'] = titulo;
  __exp['render'] = render;
  __exp['activar'] = activar;
  return __exp;
});

__def('ui/views/comparador.js', (__req) => {
  const __exp = {};
  /**
   * Comparador general — el mismo producto en todos los canales, a la vez.
   *
   * La regla que resuelve el problema original: NUNCA se comparan modalidades
   * distintas. Se elige una modalidad y se ven sólo los precios de esa modalidad.
   * Un canal que no la ofrece aparece vacío, no comparado contra otra cosa.
   *
   * El modo "equivalente contado" existe para el otro lado del problema: cuando
   * hace falta saber si el precio de vidriera de un canal está desalineado, se
   * lleva todo a base contado dividiendo por el recargo de su modalidad.
   */

  const { obtener, simular, modalidades } = __req('data/store.js');
  const { pesos, pesosFirmado, porcentaje, barraMargen, etiquetaModalidad, chipMarketplace, escapar } = __req('ui/format.js');
  const { tabla, activarOrden, buscador, selector, aviso, descargarCsv, notificar } = __req('ui/componentes.js');
  const { precioEquivalenteContado } = __req('core/engine.js');
  const orden = {};
  const filtro = { texto: '', modalidad: 'CONTADO', vista: 'modalidad' };

  const titulo = 'Comparador de canales';

  /** Una fila por SKU, una columna por canal. */
  const armarFilas = () => {
    const { productos, publicaciones, marketplaces, cfg } = obtener();
    const activos = marketplaces.filter((m) => m.activo === true || m.activo === 'true');

    return productos
      .filter((p) => p.estado !== 'INACTIVO')
      .map((prod) => {
        const fila = { sku: prod.sku, descripcion: prod.descripcion, marca: prod.marca, canales: {} };
        activos.forEach((mp) => {
          const contado = publicaciones.find((x) => x.sku === prod.sku && x.marketplace_id === mp.id && x.modalidad === 'CONTADO');
          if (!contado) return;

          if (filtro.vista === 'equivalente') {
            // Se toma cada publicación real y se la lleva a base contado.
            const propias = publicaciones.filter((x) => x.sku === prod.sku && x.marketplace_id === mp.id);
            const ref = propias[0];
            const eq = precioEquivalenteContado({ pvpConIva: ref.pvp_c_iva, cfg, marketplaceId: mp.id, modalidad: ref.modalidad });
            const r = simular({ sku: prod.sku, marketplaceId: mp.id, modalidad: ref.modalidad, pvpConIva: ref.pvp_c_iva });
            if (r) fila.canales[mp.id] = { ...r, precioMostrado: eq, modalidadReal: ref.modalidad };
            return;
          }

          const modalidad = filtro.modalidad;
          const soportadas = modalidades(mp.id).map(String);
          if (!soportadas.includes(String(modalidad))) return;

          const pub = publicaciones.find((x) => x.sku === prod.sku && x.marketplace_id === mp.id && String(x.modalidad) === String(modalidad));
          const variantes = mp.soporta_variantes_cuotas === true || mp.soporta_variantes_cuotas === 'true';
          // Si el canal usa precio único, se proyecta la modalidad sobre ese precio.
          if (!pub && variantes && modalidad !== 'CONTADO') return;

          const precio = pub ? pub.pvp_c_iva : contado.pvp_c_iva;
          const r = simular({ sku: prod.sku, marketplaceId: mp.id, modalidad, pvpConIva: precio });
          if (r) fila.canales[mp.id] = { ...r, precioMostrado: precio, proyectada: !pub };
        });
        return fila;
      })
      .filter((f) => Object.keys(f.canales).length > 0);
  };

  const columnas = () => {
    const { marketplaces } = obtener();
    const activos = marketplaces.filter((m) => m.activo === true || m.activo === 'true');
    const cols = [
      { clave: 'sku', titulo: 'SKU', mono: true, ancho: '74px' },
      { clave: 'descripcion', titulo: 'Producto', render: (f) => escapar(f.descripcion || '') },
    ];
    activos.forEach((mp) => {
      cols.push({
        clave: `mp_${mp.id}`,
        titulo: mp.nombre,
        ancho: '190px',
        valor: (f) => f.canales[mp.id]?.margenSobreFacturacionNeta ?? null,
        render: (f) => {
          const c = f.canales[mp.id];
          if (!c) return '<span class="celda-sin-dato" title="Este canal no ofrece esta modalidad">no aplica</span>';
          return `<div class="celda-canal">
            <div class="celda-canal__precio mono">${pesos(c.precioMostrado)}${c.proyectada ? '<span class="asterisco" title="Modalidad proyectada sobre el precio único del canal">*</span>' : ''}</div>
            ${barraMargen(c.margenSobreFacturacionNeta)}
            <div class="celda-canal__utilidad mono ${c.negativo ? 'cifra-perdida' : ''}">${pesosFirmado(c.utilidad)}</div>
          </div>`;
        },
      });
    });
    cols.push({
      clave: 'mejor',
      titulo: 'Mejor canal',
      ancho: '120px',
      valor: (f) => Math.max(...Object.values(f.canales).map((c) => c.margenSobreFacturacionNeta ?? -9)),
      render: (f) => {
        const pares = Object.entries(f.canales);
        if (!pares.length) return '—';
        const [id, c] = pares.reduce((a, b) => ((a[1].margenSobreFacturacionNeta ?? -9) > (b[1].margenSobreFacturacionNeta ?? -9) ? a : b));
        return `${chipMarketplace(id)} <span class="mono tenue">${porcentaje(c.margenSobreFacturacionNeta)}</span>`;
      },
    });
