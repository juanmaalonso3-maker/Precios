    return cols;
  };

  const render = () => {
    let filas = armarFilas();
    if (filtro.texto) {
      const t = filtro.texto.toLowerCase();
      filas = filas.filter((f) => String(f.sku).includes(t) || String(f.descripcion || '').toLowerCase().includes(t));
    }

    const todasModalidades = [...new Set(obtener().marketplaces.flatMap((m) => modalidades(m.id).map(String)))]
      .sort((a, b) => (a === 'CONTADO' ? -1 : b === 'CONTADO' ? 1 : Number(a) - Number(b)));

    return `
      <div class="barra-herramientas">
        ${buscador(filtro.texto)}
        ${selector('vista', [
          { valor: 'modalidad', texto: 'Comparar por modalidad' },
          { valor: 'equivalente', texto: 'Comparar en equivalente contado' },
        ], filtro.vista)}
        ${filtro.vista === 'modalidad'
      ? selector('modalidad', todasModalidades.map((m) => ({ valor: m, texto: etiquetaModalidad(m) })), filtro.modalidad)
      : ''}
        <button class="btn btn--fantasma" id="exportar">Descargar CSV</button>
      </div>

      ${filtro.vista === 'modalidad'
      ? aviso(`Comparando <b>${escapar(etiquetaModalidad(filtro.modalidad))}</b> contra <b>${escapar(etiquetaModalidad(filtro.modalidad))}</b>. Los canales que no ofrecen esta modalidad quedan en blanco: nunca se cruzan condiciones comerciales distintas.`)
      : aviso('Cada precio se divide por el recargo de su modalidad para llevarlo a base contado. Sirve para detectar precios de vidriera desalineados entre canales.')}

      ${tabla(columnas(), filas, {
        id: 'comp',
        ...(orden.comp || { ordenPor: 'sku', ordenAsc: true }),
        vacio: 'Ningún producto tiene publicaciones en esta modalidad.',
      })}

      <p class="pie-nota">El asterisco marca una modalidad proyectada: el canal tiene un precio único y el margen se calcula sobre ese precio con el costo financiero del plazo elegido.</p>`;
  };

  const activar = (contenedor, refrescar) => {
    activarOrden(contenedor, orden, refrescar);

    const busc = contenedor.querySelector('#buscador');
    if (busc) busc.addEventListener('input', (e) => {
      filtro.texto = e.target.value;
      refrescar();
      const n = document.querySelector('#buscador');
      if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    });

    const vista = contenedor.querySelector('#vista');
    if (vista) vista.addEventListener('change', (e) => { filtro.vista = e.target.value; refrescar(); });

    const mod = contenedor.querySelector('#modalidad');
    if (mod) mod.addEventListener('change', (e) => { filtro.modalidad = e.target.value; refrescar(); });

    const exp = contenedor.querySelector('#exportar');
    if (exp) exp.addEventListener('click', () => {
      const { marketplaces } = obtener();
      const activos = marketplaces.filter((m) => m.activo === true || m.activo === 'true');
      const filas = armarFilas();
      const cab = ['SKU', 'Producto', ...activos.flatMap((m) => [`${m.id} precio`, `${m.id} margen %`, `${m.id} utilidad`])];
      descargarCsv(`comparador-${filtro.vista}-${filtro.modalidad}.csv`, cab,
        filas.map((f) => [f.sku, f.descripcion, ...activos.flatMap((m) => {
          const c = f.canales[m.id];
          return c
            ? [Math.round(c.precioMostrado), (c.margenSobreFacturacionNeta * 100).toFixed(2), Math.round(c.utilidad)]
            : ['', '', ''];
        })]));
      notificar('CSV descargado.');
    });
  };

  __exp['titulo'] = titulo;
  __exp['render'] = render;
  __exp['activar'] = activar;
  return __exp;
});

__def('ui/views/productos.js', (__req) => {
  const __exp = {};
  /**
   * Base Maestra de Productos — donde vive la información técnica.
   *
   * Cada cambio acá recalcula todas las rentabilidades: el costo en USD, el peso y
   * las medidas alimentan las cinco pantallas de rentabilidad y el comparador.
   *
   * Las medidas están separadas a propósito: las reales viven en el producto, y
   * cada canal guarda las suyas. Un mismo producto puede declararse con medidas
   * distintas en cada marketplace, y el sistema nunca reutiliza el peso
   * volumétrico de MercadoLibre para los demás.
   */

  const { obtener, persistir } = __req('data/store.js');
  const { pesos, kilos, escapar } = __req('ui/format.js');
  const { tabla, indicadores, activarOrden, buscador, selector, panel, campo, leerCampos, notificar, descargarCsv, aviso } = __req('ui/componentes.js');
  const { pesoVolumetrico } = __req('core/tarifas.js');
  const orden = {};
  const filtro = { texto: '', marca: 'TODAS', estado: 'ACTIVO' };

  const titulo = 'Base maestra de productos';

  const volumetrico = (p, divisor) => pesoVolumetrico(p.alto, p.ancho, p.largo, divisor);

  const columnas = (cfg) => [
    { clave: 'sku', titulo: 'SKU', mono: true, ancho: '74px' },
    { clave: 'descripcion', titulo: 'Producto', render: (f) => escapar(f.descripcion || '') },
    { clave: 'marca', titulo: 'Marca', ancho: '84px' },
    { clave: 'categoria', titulo: 'Categoría', ancho: '132px' },
    { clave: 'modelo', titulo: 'Modelo', mono: true, ancho: '86px' },
    { clave: 'costo_usd', titulo: 'Costo USD', alinear: 'der', mono: true, ancho: '90px', render: (f) => (f.costo_usd ? f.costo_usd.toFixed(2) : '<span class="cifra-perdida">falta</span>') },
    { clave: 'costo_ars', titulo: 'Costo ARS', alinear: 'der', mono: true, ancho: '96px', render: (f) => pesos(f.costo_usd * cfg.tc), valor: (f) => f.costo_usd * cfg.tc },
    { clave: 'peso_real', titulo: 'Peso real', alinear: 'der', mono: true, ancho: '84px', render: (f) => kilos(f.peso_real) },
    { clave: 'medidas', titulo: 'Medidas reales', mono: true, ancho: '132px', render: (f) => (f.alto && f.ancho && f.largo ? `${f.alto} × ${f.ancho} × ${f.largo}` : '<span class="celda-sin-dato">sin medidas</span>'), valor: (f) => f.alto },
    { clave: 'volumetrico', titulo: 'Volumétrico', alinear: 'der', mono: true, ancho: '96px', render: (f) => kilos(volumetrico(f, cfg.divisorVolumetrico)), valor: (f) => volumetrico(f, cfg.divisorVolumetrico) ?? -1, ayuda: 'Alto × ancho × largo / divisor' },
    { clave: 'es_combo', titulo: 'Combo', ancho: '76px', render: (f) => (f.es_combo === true || f.es_combo === 'true' ? `<span class="chip" title="${escapar(f.receta || 'Combo')}">combo</span>` : '') },
    { clave: 'estado', titulo: 'Estado', ancho: '86px', render: (f) => `<span class="chip${f.estado === 'INACTIVO' ? ' chip--apagado' : ''}">${escapar(f.estado || 'ACTIVO')}</span>` },
    {
      clave: 'acciones', titulo: '', ancho: '110px',
      render: (f) => `<button class="btn btn--mini" data-editar="${escapar(f.sku)}">Editar</button>
        <button class="btn btn--mini btn--fantasma" data-canales="${escapar(f.sku)}">Canales</button>`,
    },
  ];

  const render = () => {
    const { productos, cfg, productoMarketplace } = obtener();
    let filas = productos;

    if (filtro.estado !== 'TODOS') filas = filas.filter((p) => (p.estado || 'ACTIVO') === filtro.estado);
    if (filtro.marca !== 'TODAS') filas = filas.filter((p) => p.marca === filtro.marca);
    if (filtro.texto) {
      const t = filtro.texto.toLowerCase();
      filas = filas.filter((p) => String(p.sku).includes(t)
        || String(p.descripcion || '').toLowerCase().includes(t)
        || String(p.modelo || '').toLowerCase().includes(t));
    }

    const marcas = [...new Set(productos.map((p) => p.marca).filter(Boolean))].sort();
    const sinCosto = productos.filter((p) => !p.costo_usd).length;
    const sinMedidas = productos.filter((p) => !(p.alto && p.ancho && p.largo)).length;
    const sinMedidasCanal = productoMarketplace.filter((x) => x.marketplace_id !== 'ML' && !(x.alto && x.ancho && x.largo)).length;

    return `
      ${indicadores([
        { etiqueta: 'Productos', valor: String(productos.length), pie: `${productos.filter((p) => p.estado !== 'INACTIVO').length} activos` },
        { etiqueta: 'Tipo de cambio', valor: pesos(cfg.tc), pie: 'se aplica a todo el catálogo' },
        { etiqueta: 'Sin costo en USD', valor: String(sinCosto), alerta: sinCosto > 0 },
        { etiqueta: 'Sin medidas reales', valor: String(sinMedidas), alerta: sinMedidas > 0 },
        { etiqueta: 'Sin medidas por canal', valor: String(sinMedidasCanal), alerta: sinMedidasCanal > 0 },
      ])}

      <div class="barra-herramientas">
        ${buscador(filtro.texto, 'Buscar por SKU, producto o modelo')}
        ${selector('marca', [{ valor: 'TODAS', texto: 'Todas las marcas' }, ...marcas.map((m) => ({ valor: m, texto: m }))], filtro.marca)}
        ${selector('estado', [
          { valor: 'ACTIVO', texto: 'Sólo activos' },
          { valor: 'INACTIVO', texto: 'Sólo inactivos' },
          { valor: 'TODOS', texto: 'Todos' },
        ], filtro.estado)}
        <button class="btn btn--fantasma" id="exportar">Descargar CSV</button>
      </div>

      ${aviso('Cambiar un costo, un peso o una medida recalcula al instante todas las rentabilidades y el comparador.')}

      ${tabla(columnas(cfg), filas, {
        id: 'prods',
        ...(orden.prods || { ordenPor: 'sku', ordenAsc: true }),
        vacio: 'Ningún producto coincide con los filtros.',
      })}`;
  };

  const activar = (contenedor, refrescar) => {
    activarOrden(contenedor, orden, refrescar);

    const busc = contenedor.querySelector('#buscador');
    if (busc) busc.addEventListener('input', (e) => {
      filtro.texto = e.target.value;
      refrescar();
      const n = document.querySelector('#buscador');
      if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    });
    ['marca', 'estado'].forEach((k) => {
      const el = contenedor.querySelector(`#${k}`);
      if (el) el.addEventListener('change', (e) => { filtro[k] = e.target.value; refrescar(); });
    });

    const exp = contenedor.querySelector('#exportar');
    if (exp) exp.addEventListener('click', () => {
      const { productos, cfg } = obtener();
      descargarCsv('base-maestra.csv',
        ['SKU', 'Producto', 'Marca', 'Categoria', 'Modelo', 'Estado', 'Costo USD', 'Costo ARS',
          'Peso real', 'Alto', 'Ancho', 'Largo', 'Volumetrico', 'Combo', 'Receta'],
        productos.map((p) => [p.sku, p.descripcion, p.marca, p.categoria, p.modelo, p.estado,
          p.costo_usd, Math.round(p.costo_usd * cfg.tc), p.peso_real, p.alto, p.ancho, p.largo,
          (volumetrico(p, cfg.divisorVolumetrico) ?? '').toFixed ? volumetrico(p, cfg.divisorVolumetrico).toFixed(3) : '',
          p.es_combo, p.receta]));
      notificar('CSV descargado.');
    });

    contenedor.querySelectorAll('[data-editar]').forEach((b) =>
      b.addEventListener('click', () => editarProducto(b.dataset.editar, refrescar)));
    contenedor.querySelectorAll('[data-canales]').forEach((b) =>
      b.addEventListener('click', () => editarCanales(b.dataset.canales, refrescar)));
  };

  const editarProducto = (sku, refrescar) => {
    const { productos, cfg } = obtener();
    const p = productos.find((x) => x.sku === sku);
    if (!p) return;

    const cuerpo = `
      <p class="panel__intro">${escapar(p.descripcion || sku)} · SKU ${escapar(sku)}</p>
      ${campo('Descripción', 'descripcion', p.descripcion || '', { tipo: 'text' })}
      ${campo('Marca', 'marca', p.marca || '', { tipo: 'text' })}
      ${campo('Categoría', 'categoria', p.categoria || '', { tipo: 'text' })}
      ${campo('Modelo', 'modelo', p.modelo || '', { tipo: 'text' })}
      ${campo('Costo', 'costo_usd', p.costo_usd, { paso: '0.01', sufijo: 'USD, nacionalizado y sin IVA', ayuda: `Al tipo de cambio actual: ${pesos(p.costo_usd * cfg.tc)}` })}
      ${campo('Peso real', 'peso_real', p.peso_real, { paso: '0.01', sufijo: 'kg' })}
      <div class="grilla-3">
        ${campo('Alto', 'alto', p.alto, { paso: '0.1', sufijo: 'cm' })}
        ${campo('Ancho', 'ancho', p.ancho, { paso: '0.1', sufijo: 'cm' })}
        ${campo('Largo', 'largo', p.largo, { paso: '0.1', sufijo: 'cm' })}
      </div>
      <p class="campo__ayuda" id="calc-vol"></p>
      ${campo('Estado', 'estado', p.estado || 'ACTIVO', {
        opcionesSelect: [{ valor: 'ACTIVO', texto: 'Activo' }, { valor: 'INACTIVO', texto: 'Inactivo' }],
      })}
      ${campo('Receta del combo', 'receta', p.receta || '', { tipo: 'text', ayuda: 'Para combos: qué SKUs lo componen. El costo en USD es la suma de los componentes.' })}
      ${campo('Notas', 'notas', p.notas || '', { tipo: 'text' })}`;

    const pan = panel('Editar producto', cuerpo, async (cont) => {
      const datos = leerCampos(cont);
      await persistir('Productos', [{ sku, ...datos }]);
      notificar('Producto guardado. Rentabilidades recalculadas.');
      refrescar();
    });

    const nota = pan.querySelector('#calc-vol');
    const pintar = () => {
      const d = leerCampos(pan.querySelector('.panel__cuerpo'));
      const v = pesoVolumetrico(d.alto, d.ancho, d.largo, cfg.divisorVolumetrico);
      const real = Number(d.peso_real) || 0;
      nota.innerHTML = v === null
        ? 'Completá las tres medidas para calcular el peso volumétrico.'
        : `Peso volumétrico ${kilos(v)}. Se factura por ${kilos(Math.max(v, real))}, que es el mayor entre real y volumétrico.`;
    };
    pan.querySelectorAll('[name="alto"],[name="ancho"],[name="largo"],[name="peso_real"]')
      .forEach((el) => el.addEventListener('input', pintar));
    pintar();
  };

  const editarCanales = (sku, refrescar) => {
    const { productoMarketplace, marketplaces, productos, cfg } = obtener();
    const prod = productos.find((x) => x.sku === sku);
    const propias = marketplaces.map((mp) => ({
      mp, fila: productoMarketplace.find((x) => x.sku === sku && x.marketplace_id === mp.id),
    })).filter((x) => x.fila);

    const cuerpo = `
      <p class="panel__intro">${escapar(prod?.descripcion || sku)} · configuración por canal</p>
      ${propias.map(({ mp, fila }) => {
      const esML = mp.id === 'ML';
      return `<fieldset class="grupo" data-mp="${escapar(mp.id)}">
          <legend>${escapar(mp.nombre)}</legend>
          <div class="grilla-2">
            ${campo('Comisión', `${mp.id}__comision_pct`, fila.comision_pct, { paso: '0.0001', sufijo: mp.comision_iva_mode === 'incluido' ? 'IVA incluido' : '+ IVA' })}
            ${campo('Publicidad', `${mp.id}__publicidad_pct`, fila.publicidad_pct, { paso: '0.001' })}
            ${campo('Gastos varios', `${mp.id}__varios_pct`, fila.varios_pct, { paso: '0.001' })}
            ${campo('SKU en el canal', `${mp.id}__sku_externo`, fila.sku_externo || '', { tipo: 'text' })}
          </div>
          ${esML ? `
            ${campo('Peso volumétrico cargado en ML', `${mp.id}__peso_volumetrico_manual`, fila.peso_volumetrico_manual, { paso: '0.001', sufijo: 'kg', ayuda: 'ML factura por el valor que cargamos en la publicación, no por las medidas. Si está en cero, se calcula desde las medidas de abajo.' })}
            ${campo('Modalidad de envío', `${mp.id}__modalidad_envio`, fila.modalidad_envio || 'ME', {
        opcionesSelect: [{ valor: 'ME', texto: 'Logística de ML' }, { valor: 'ME1', texto: 'ME1 · envío propio' }],
      })}
            ${campo('Importe del envío ME1', `${mp.id}__envio_me1_manual_c_iva`, fila.envio_me1_manual_c_iva, { paso: '1', sufijo: 'con IVA', ayuda: 'Sólo si la modalidad es ME1. Cargalo con IVA: el sistema lo netea.' })}
          ` : ''}
          <div class="grilla-4">
            ${campo('Peso', `${mp.id}__peso_real`, fila.peso_real, { paso: '0.01', sufijo: 'kg' })}
            ${campo('Alto', `${mp.id}__alto`, fila.alto, { paso: '0.1', sufijo: 'cm' })}
            ${campo('Ancho', `${mp.id}__ancho`, fila.ancho, { paso: '0.1', sufijo: 'cm' })}
            ${campo('Largo', `${mp.id}__largo`, fila.largo, { paso: '0.1', sufijo: 'cm' })}
          </div>
          ${fila.notas ? `<p class="campo__ayuda campo__ayuda--marcada">${escapar(fila.notas)}</p>` : ''}
        </fieldset>`;
    }).join('')}
      <p class="campo__ayuda">Las medidas de cada canal son independientes. El peso volumétrico de MercadoLibre nunca se reutiliza en los demás.</p>`;

    panel('Configuración por canal', cuerpo, async (cont) => {
      const datos = leerCampos(cont);
      const filas = {};
      Object.entries(datos).forEach(([k, v]) => {
        const [mpId, campoNombre] = k.split('__');
        if (!campoNombre) return;
        (filas[mpId] ||= { sku, marketplace_id: mpId })[campoNombre] = v;
      });
      await persistir('ProductoMarketplace', Object.values(filas));
      notificar('Configuración guardada. Rentabilidades recalculadas.');
      refrescar();
    });
  };

  __exp['titulo'] = titulo;
  __exp['render'] = render;
  __exp['activar'] = activar;
  return __exp;
});

__def('ui/views/configuracion.js', (__req) => {
  const __exp = {};
  /**
   * Configuración — toda la lógica del sistema es editable desde acá.
   *
   * No hay un solo valor de negocio escrito en el código: comisiones, umbrales,
   * costos financieros, markups, IIBB, tipo de cambio y las cinco tablas de
   * tarifas viven en el Sheets y se editan en esta pantalla.
   */

  const { obtener, persistir } = __req('data/store.js');
  const { pesos, porcentaje, kilos, escapar } = __req('ui/format.js');
  const { tabla, activarOrden, selector, panel, campo, leerCampos, notificar, aviso, descargarCsv } = __req('ui/componentes.js');
  const orden = {};
  const estadoUi = { tablaTarifa: 'ML_ENVIO' };

  const titulo = 'Configuración';

  const ETIQUETAS_TARIFA = {
    ML_ENVIO: 'MercadoLibre · envío que absorbemos (PVP ≥ umbral)',
    ML_COMISION_FIJA: 'MercadoLibre · cargo fijo por venta (PVP < umbral)',
    FRAVEGA_FEE: 'Frávega · fee logístico',
    ONCITY_FEE: 'OnCity · fee logístico',
    VIACOMPRAS_FEE: 'ViaCompras · fee logístico',
    BNA_FEE: 'Tienda BNA · fee logístico',
  };

  const render = () => {
    const { raw, cfg, marketplaces, tarifas } = obtener();

    const colsGlobal = [
      { clave: 'clave', titulo: 'Parámetro', mono: true, ancho: '210px' },
      {
        clave: 'valor', titulo: 'Valor', alinear: 'der', mono: true, ancho: '120px',
        render: (f) => (String(f.tipo) === 'porcentaje' ? porcentaje(Number(f.valor), 2) : pesos(Number(f.valor))),
        valor: (f) => Number(f.valor),
      },
      { clave: 'marketplace_id', titulo: 'Canal', ancho: '90px', render: (f) => escapar(f.marketplace_id || '—') },
      { clave: 'descripcion', titulo: 'Qué hace', render: (f) => escapar(f.descripcion || '') },
      { clave: 'acciones', titulo: '', ancho: '80px', render: (f) => `<button class="btn btn--mini" data-cfg="${escapar(f.clave)}">Editar</button>` },
    ];

    const colsFin = [
      { clave: 'marketplace_id', titulo: 'Canal', ancho: '110px' },
      { clave: 'cuotas', titulo: 'Cuotas', alinear: 'der', mono: true, ancho: '80px', valor: (f) => Number(f.cuotas) },
      {
        clave: 'costo_real', titulo: 'Costo del canal', alinear: 'der', mono: true, ancho: '120px',
        render: (f) => (Number(f.costo_real) ? porcentaje(Number(f.costo_real), 2) : '<span class="cifra-perdida">falta</span>'),
        valor: (f) => Number(f.costo_real),
      },
      { clave: 'markup', titulo: 'Markup propio', alinear: 'der', mono: true, ancho: '120px', render: (f) => porcentaje(Number(f.markup), 2), valor: (f) => Number(f.markup) },
      {
        clave: 'recargo', titulo: 'Recargo total', alinear: 'der', mono: true, ancho: '120px',
        render: (f) => porcentaje(Number(f.costo_real) + Number(f.markup), 2),
        valor: (f) => Number(f.costo_real) + Number(f.markup),
        ayuda: 'Lo que se suma al precio de contado para esta modalidad',
      },
      { clave: 'notas', titulo: 'Nota', render: (f) => escapar(f.notas || '') },
      { clave: 'acciones', titulo: '', ancho: '80px', render: (f) => `<button class="btn btn--mini" data-fin="${escapar(f.marketplace_id)}|${escapar(f.cuotas)}">Editar</button>` },
    ];

    const colsMp = [
      { clave: 'id', titulo: 'ID', mono: true, ancho: '92px' },
      { clave: 'nombre', titulo: 'Canal', ancho: '130px' },
      { clave: 'activo', titulo: 'Activo', ancho: '80px', render: (f) => `<span class="chip${f.activo === true || f.activo === 'true' ? '' : ' chip--apagado'}">${f.activo === true || f.activo === 'true' ? 'sí' : 'no'}</span>` },
      { clave: 'comision_pct_default', titulo: 'Comisión base', alinear: 'der', mono: true, ancho: '110px', render: (f) => porcentaje(Number(f.comision_pct_default), 2) },
      {
        clave: 'comision_iva_mode', titulo: 'IVA de la comisión', ancho: '150px',
        render: (f) => `<span class="chip" title="${f.comision_iva_mode === 'incluido' ? 'La tasa publicada ya contiene IVA' : 'La tasa se aplica y después se le suma IVA'}">${f.comision_iva_mode === 'incluido' ? 'por dentro' : 'por fuera'}</span>`,
      },
      { clave: 'umbral_envio', titulo: 'Umbral de envío', alinear: 'der', mono: true, ancho: '120px', render: (f) => (Number(f.umbral_envio) ? pesos(Number(f.umbral_envio)) : '—') },
      { clave: 'notas', titulo: 'Cómo funciona', render: (f) => escapar(f.notas || '') },
    ];

    const filasTarifa = (tarifas[estadoUi.tablaTarifa] || []).slice()
      .sort((a, b) => a.peso_max - b.peso_max || a.precio_min - b.precio_min);
    const colsTarifa = [
      { clave: 'peso', titulo: 'Escalón de peso', mono: true, ancho: '170px', render: (f) => `más de ${kilos(f.peso_min)} hasta ${f.peso_max >= 1e12 ? '∞' : kilos(f.peso_max)}`, valor: (f) => f.peso_max },
      { clave: 'precio', titulo: 'Tramo de precio', mono: true, ancho: '200px', render: (f) => (f.precio_max >= 1e12 ? `desde ${pesos(f.precio_min)}` : `${pesos(f.precio_min)} a ${pesos(f.precio_max - 1)}`), valor: (f) => f.precio_min },
      { clave: 'valor_c_iva', titulo: 'Tarifa c/IVA', alinear: 'der', mono: true, ancho: '120px', render: (f) => pesos(f.valor_c_iva) },
      { clave: 'neto', titulo: 'Neto', alinear: 'der', mono: true, ancho: '120px', render: (f) => pesos(f.valor_c_iva / (1 + cfg.iva)), valor: (f) => f.valor_c_iva },
      { clave: 'vigencia_desde', titulo: 'Vigente desde', mono: true, ancho: '120px' },
    ];

    const opcTablas = Object.keys(ETIQUETAS_TARIFA)
      .filter((k) => (tarifas[k] || []).length)
      .map((k) => ({ valor: k, texto: ETIQUETAS_TARIFA[k] }));

    return `
      <section class="bloque">
        <header class="bloque__cabecera">
          <h2>Parámetros globales</h2>
          <p>Se aplican a todo el catálogo. Cambiar el tipo de cambio recalcula el costo de los 40 productos.</p>
        </header>
        ${tabla(colsGlobal, raw.Config || [], { id: 'cfg', ...(orden.cfg || { ordenPor: 'clave', ordenAsc: true }) })}
      </section>

      <section class="bloque">
        <header class="bloque__cabecera">
          <h2>Canales</h2>
          <p>Cómo trata el IVA cada canal es lo que hace que la misma tasa nominal cueste distinto. Con IVA por dentro, 15% sobre $100 cuesta $12,40; con IVA por fuera, cuesta $15,00.</p>
        </header>
        ${tabla(colsMp, marketplaces, { id: 'mps', ...(orden.mps || { ordenPor: 'id', ordenAsc: true }) })}
      </section>

      <section class="bloque">
        <header class="bloque__cabecera">
          <h2>Financiación en cuotas</h2>
          <p>El costo del canal es lo que cobra el marketplace; el markup es nuestro margen adicional. El precio de cada modalidad se calcula siempre desde el contado, nunca desde la modalidad anterior.</p>
        </header>
        ${aviso('El costo financiero se cobra sobre el precio ya recargado, así que un markup plano deja menos margen a medida que se estira el plazo. Si el margen a 12 o 18 cuotas queda por debajo del de contado, hay que subir el markup de esos plazos.')}
        ${tabla(colsFin, raw.Financiacion || [], { id: 'fin', ...(orden.fin || { ordenPor: 'marketplace_id', ordenAsc: true }) })}
      </section>

      <section class="bloque">
        <header class="bloque__cabecera">
          <h2>Tablas de tarifas</h2>
          <p>Cada fila es un escalón de peso cruzado con un tramo de precio. Agregar un escalón es agregar una fila en el Sheets: no hay que tocar nada del código.</p>
        </header>
        <div class="barra-herramientas">
          ${selector('tabla-tarifa', opcTablas, estadoUi.tablaTarifa)}
          <button class="btn btn--fantasma" id="exportar-tarifas">Descargar CSV</button>
        </div>
        ${tabla(colsTarifa, filasTarifa, { id: 'tar', ...(orden.tar || { ordenPor: 'peso', ordenAsc: true }) })}
      </section>

      <p class="pie-nota">
        Convención de escalones: el mínimo es excluyente y el máximo incluyente. Un bulto de 5,0 kg entra en el
        escalón "1 a 5 kg"; uno de 5,1 kg pasa al siguiente. Los tramos de precio van al revés, como los publican
        los canales: "$33.000 a $49.999" incluye el mínimo y excluye el máximo.
      </p>`;
  };

  const activar = (contenedor, refrescar) => {
    activarOrden(contenedor, orden, refrescar);

    const sel = contenedor.querySelector('#tabla-tarifa');
    if (sel) sel.addEventListener('change', (e) => { estadoUi.tablaTarifa = e.target.value; refrescar(); });

    const exp = contenedor.querySelector('#exportar-tarifas');
    if (exp) exp.addEventListener('click', () => {
      const { tarifas } = obtener();
      descargarCsv(`tarifas-${estadoUi.tablaTarifa.toLowerCase()}.csv`,
        ['Peso min', 'Peso max', 'Precio min', 'Precio max', 'Tarifa c/IVA', 'Vigente desde'],
        (tarifas[estadoUi.tablaTarifa] || []).map((t) => [t.peso_min, t.peso_max, t.precio_min,
          t.precio_max >= 1e12 ? '' : t.precio_max, t.valor_c_iva, t.vigencia_desde]));
      notificar('CSV descargado.');
    });

    contenedor.querySelectorAll('[data-cfg]').forEach((b) =>
      b.addEventListener('click', () => editarParametro(b.dataset.cfg, refrescar)));
    contenedor.querySelectorAll('[data-fin]').forEach((b) =>
      b.addEventListener('click', () => editarFinanciacion(b.dataset.fin, refrescar)));
  };

  const editarParametro = (clave, refrescar) => {
    const fila = (obtener().raw.Config || []).find((c) => c.clave === clave);
    if (!fila) return;
    const esPct = String(fila.tipo) === 'porcentaje';

    panel('Editar parámetro', `
      <p class="panel__intro">${escapar(clave)}</p>
      <p class="campo__ayuda campo__ayuda--marcada">${escapar(fila.descripcion || '')}</p>
      ${campo(esPct ? 'Valor (como fracción)' : 'Valor', 'valor', fila.valor, {
      paso: esPct ? '0.0001' : '1',
      sufijo: esPct ? `hoy ${porcentaje(Number(fila.valor), 2)}` : '',
      ayuda: esPct ? 'Se escribe como fracción: 0,04 equivale a 4%.' : '',
    })}
    `, async (cont) => {
      const datos = leerCampos(cont);
      await persistir('Config', [{ clave, valor: datos.valor }]);
      notificar('Parámetro guardado. Todo el catálogo recalculado.');
      refrescar();
    });
  };

  const editarFinanciacion = (id, refrescar) => {
    const [mp, cuotas] = id.split('|');
    const fila = (obtener().raw.Financiacion || [])
      .find((f) => String(f.marketplace_id) === mp && String(f.cuotas) === cuotas);
    if (!fila) return;

    panel(`Financiación · ${mp} · ${cuotas} cuotas`, `
      ${campo('Costo del canal', 'costo_real', fila.costo_real, { paso: '0.0001', sufijo: 'fracción', ayuda: 'Lo que cobra el marketplace por financiar. 0,232 equivale a 23,2%.' })}
      ${campo('Markup propio', 'markup', fila.markup, { paso: '0.0001', sufijo: 'fracción', ayuda: 'Nuestro margen adicional por encima del costo del canal.' })}
      ${campo('Nota', 'notas', fila.notas || '', { tipo: 'text' })}
    `, async (cont) => {
      const datos = leerCampos(cont);
      await persistir('Financiacion', [{ marketplace_id: mp, cuotas: Number(cuotas), ...datos }]);
      notificar('Financiación guardada.');
      refrescar();
    });
  };

  __exp['titulo'] = titulo;
  __exp['render'] = render;
  __exp['activar'] = activar;
  return __exp;
});

__def('ui/views/logs.js', (__req) => {
  const __exp = {};
  /**
   * Logs — auditoría de cambios.
   *
   * Se registran cambios de datos y de configuración, altas, bajas y errores. Los
   * cálculos no se registran: con ~1.200 evaluaciones por recálculo la hoja se
   * llenaría en días sin aportar nada, y el margen de cualquier momento se puede
   * reconstruir desde el precio y los parámetros vigentes.
   */

  const { traerLogs, urlLogsCsv, hayBackend } = __req('data/api.js');
  const { escapar } = __req('ui/format.js');
  const { tabla, activarOrden, buscador, selector, aviso, notificar, descargarCsv } = __req('ui/componentes.js');
  const orden = {};
  const filtro = { texto: '', tipo: 'TODOS' };
  let cache = null;
  let cargando = false;

  const titulo = 'Auditoría';

  const fecha = (v) => {
    const d = v instanceof Date ? v : new Date(v);
    return Number.isNaN(d.getTime()) ? String(v ?? '') : d.toLocaleString('es-AR');
  };

  const columnas = () => [
    { clave: 'timestamp', titulo: 'Fecha y hora', mono: true, ancho: '160px', render: (f) => escapar(fecha(f.timestamp)), valor: (f) => new Date(f.timestamp).getTime() },
    { clave: 'tipo', titulo: 'Tipo', ancho: '110px', render: (f) => `<span class="chip${f.tipo === 'ERROR' ? ' chip--alerta' : ''}">${escapar(f.tipo)}</span>` },
    { clave: 'entidad', titulo: 'Dónde', ancho: '150px' },
    { clave: 'entidad_id', titulo: 'Registro', mono: true, ancho: '150px' },
    { clave: 'campo', titulo: 'Campo', mono: true, ancho: '130px' },
    { clave: 'valor_anterior', titulo: 'Antes', alinear: 'der', mono: true, ancho: '110px', render: (f) => escapar(String(f.valor_anterior ?? '')) },
    { clave: 'valor_nuevo', titulo: 'Después', alinear: 'der', mono: true, ancho: '110px', render: (f) => escapar(String(f.valor_nuevo ?? '')) },
    { clave: 'detalle', titulo: 'Detalle', render: (f) => escapar(f.detalle || '') },
    { clave: 'origen', titulo: 'Origen', ancho: '80px' },
  ];

  const render = () => {
    if (!hayBackend()) {
      return aviso('La auditoría se lee del Apps Script y ahora mismo la aplicación está usando datos de ejemplo. En cuanto la conexión funcione, acá vas a ver todos los cambios registrados.', 'info');
    }
    if (cargando) return '<div class="vacio">Trayendo el registro…</div>';
    if (cache === null) return '<div class="vacio">Trayendo el registro…</div>';

    let filas = cache;
    if (filtro.tipo !== 'TODOS') filas = filas.filter((f) => f.tipo === filtro.tipo);
    if (filtro.texto) {
      const t = filtro.texto.toLowerCase();
      filas = filas.filter((f) => Object.values(f).some((v) => String(v ?? '').toLowerCase().includes(t)));
    }

    const tipos = [...new Set(cache.map((f) => f.tipo).filter(Boolean))].sort();

    return `
      <div class="barra-herramientas">
        ${buscador(filtro.texto, 'Buscar en el registro')}
        ${selector('tipo', [{ valor: 'TODOS', texto: 'Todos los tipos' }, ...tipos.map((t) => ({ valor: t, texto: t }))], filtro.tipo)}
        <button class="btn btn--fantasma" id="recargar">Actualizar</button>
        <button class="btn btn--fantasma" id="exportar">Descargar CSV</button>
        <a class="btn btn--fantasma" href="${urlLogsCsv()}" target="_blank" rel="noopener">CSV completo del servidor</a>
      </div>
      ${tabla(columnas(), filas, {
        id: 'logs',
        ...(orden.logs || { ordenPor: 'timestamp', ordenAsc: false }),
        vacio: 'No hay eventos registrados con estos filtros.',
      })}
      <p class="pie-nota">${filas.length} de ${cache.length} eventos.</p>`;
  };

  const activar = async (contenedor, refrescar) => {
    if (!hayBackend()) return;

    if (cache === null && !cargando) {
      cargando = true;
      try {
        cache = await traerLogs();
      } catch (err) {
        cache = [];
        notificar(`No se pudo leer la auditoría: ${err.message}`, 'error');
      }
      cargando = false;
      refrescar();
      return;
    }

    activarOrden(contenedor, orden, refrescar);

    const busc = contenedor.querySelector('#buscador');
    if (busc) busc.addEventListener('input', (e) => {
      filtro.texto = e.target.value;
      refrescar();
      const n = document.querySelector('#buscador');
      if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    });

    const tipo = contenedor.querySelector('#tipo');
    if (tipo) tipo.addEventListener('change', (e) => { filtro.tipo = e.target.value; refrescar(); });

    const rec = contenedor.querySelector('#recargar');
    if (rec) rec.addEventListener('click', async () => {
      cache = null;
      refrescar();
    });

    const exp = contenedor.querySelector('#exportar');
    if (exp) exp.addEventListener('click', () => {
      descargarCsv('auditoria.csv',
        ['Fecha', 'Tipo', 'Donde', 'Registro', 'Campo', 'Antes', 'Despues', 'Detalle', 'Origen'],
        (cache || []).map((f) => [fecha(f.timestamp), f.tipo, f.entidad, f.entidad_id, f.campo,
          f.valor_anterior, f.valor_nuevo, f.detalle, f.origen]));
      notificar('CSV descargado.');
    });
  };

  __exp['titulo'] = titulo;
  __exp['render'] = render;
  __exp['activar'] = activar;
  return __exp;
});

__def('ui/app.js', (__req) => {
  const __exp = {};
  /**
   * app.js — arranque y navegación.
   *
   * Router por hash, sin dependencias. Cada vista expone render() y activar():
   * render devuelve HTML y activar conecta los eventos. Volver a renderizar es
   * regenerar el HTML y reconectar, que a esta escala es instantáneo y elimina
   * toda una clase de errores de estado desincronizado.
   */

  const { cargar, obtener, suscribir } = __req('data/store.js');
  const { escapar, pesos, porcentaje } = __req('ui/format.js');
  const { notificar } = __req('ui/componentes.js');
  const dashboard = __req('ui/views/dashboard.js');
  const rentabilidad = __req('ui/views/rentabilidad.js');
  const comparador = __req('ui/views/comparador.js');
  const productos = __req('ui/views/productos.js');
  const configuracion = __req('ui/views/configuracion.js');
  const logs = __req('ui/views/logs.js');
  const VISTAS = {
    panel: dashboard,
    rentabilidad,
    comparador,
    productos,
    configuracion,
    auditoria: logs,
  };

  let rutaActual = 'panel';

  const nombreVista = (vista) => (typeof vista.titulo === 'function' ? vista.titulo() : vista.titulo);

  const pintarNavegacion = () => {
    const { marketplaces } = obtener();
    const activos = marketplaces.filter((m) => m.activo === true || m.activo === 'true');
    const item = (ruta, texto, extra = '') =>
      `<a href="#${ruta}" class="nav__item${rutaActual === ruta ? ' nav__item--activo' : ''}">${escapar(texto)}${extra}</a>`;

    document.getElementById('nav').innerHTML = `
      <div class="nav__grupo">
        ${item('panel', 'Panel general')}
        ${item('comparador', 'Comparador')}
      </div>
      <div class="nav__grupo">
        <span class="nav__titulo">Rentabilidad por canal</span>
        ${activos.map((m) => {
      const ruta = `rentabilidad/${m.id}`;
      const enPerdida = obtener().resultados.filter((r) => r.marketplaceId === m.id && r.negativo).length;
      return `<a href="#${ruta}" class="nav__item${rutaActual === ruta ? ' nav__item--activo' : ''}">
          ${escapar(m.nombre)}${enPerdida ? `<span class="nav__marca" title="${enPerdida} en pérdida">${enPerdida}</span>` : ''}
        </a>`;
    }).join('')}
      </div>
      <div class="nav__grupo">
        <span class="nav__titulo">Administración</span>
        ${item('productos', 'Base maestra')}
        ${item('configuracion', 'Configuración')}
        ${item('auditoria', 'Auditoría')}
      </div>`;
  };

  const pintarEncabezado = (vista) => {
    const { cfg, fuente, horaCarga } = obtener();
    document.getElementById('titulo-vista').textContent = nombreVista(vista);
    document.getElementById('estado-datos').innerHTML = `
      <span class="estado__dato" title="Tipo de cambio aplicado a todo el catálogo">TC ${pesos(cfg.tc)}</span>
      <span class="estado__dato">IVA ${porcentaje(cfg.iva, 0)}</span>
      <span class="estado__dato">IIBB ${porcentaje(cfg.iibbPct, 0)}</span>
      <span class="estado__fuente estado__fuente--${fuente}">
        ${fuente === 'local' ? 'datos de ejemplo' : 'conectado'}
        <em>${horaCarga ? horaCarga.toLocaleTimeString('es-AR') : ''}</em>
      </span>`;
  };

  /**
   * Banda de aviso cuando la aplicación quedó con datos de ejemplo.
   *
   * Es persistente y no se puede cerrar: mostrar márgenes de ejemplo como si
   * fueran reales sería peor que no mostrar nada.
   */
  const pintarBanda = () => {
    const { fuente, motivo } = obtener();
    const previa = document.getElementById('banda');
    if (previa) previa.remove();
    if (fuente !== 'local') return;

    const banda = document.createElement('div');
    banda.id = 'banda';
    banda.className = 'banda';
    banda.innerHTML = `
      <div>
        <b>Estás viendo datos de ejemplo.</b>
        Los precios y márgenes son reales del catálogo, pero los cambios no se guardan.
        ${motivo ? `<span class="banda__motivo">${escapar(motivo)}</span>` : ''}
      </div>
      <button class="btn btn--mini" id="reintentar">Reintentar conexión</button>`;
    document.querySelector('.cabecera').insertAdjacentElement('afterend', banda);
    banda.querySelector('#reintentar').addEventListener('click', async (e) => {
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = 'Conectando…';
      try {
        await cargar();
        if (obtener().fuente === 'remoto') notificar('Conectado al Apps Script. Ya estás viendo datos reales.');
      } catch (err) {
        notificar(err.message, 'error');
      }
      pintar();
    });
  };

  const pintar = () => {
    const [base, param] = rutaActual.split('/');
    const vista = VISTAS[base] || VISTAS.panel;
    if (base === 'rentabilidad' && param) rentabilidad.fijarMarketplace(param);

    const contenedor = document.getElementById('vista');
    pintarEncabezado(vista);
    pintarBanda();
    pintarNavegacion();
    contenedor.innerHTML = vista.render();
    contenedor.scrollTop = 0;
    if (vista.activar) vista.activar(contenedor, pintar);
  };

  const irA = () => {
    const hash = location.hash.replace(/^#/, '') || 'panel';
    const base = hash.split('/')[0];
    rutaActual = VISTAS[base] ? hash : 'panel';
    pintar();
  };

  const mostrarError = (mensaje) => {
    const caja = document.getElementById('cargando');
    if (!caja) return;
    caja.innerHTML = `
      <div class="arranque__error">
        <h1>No se pudieron cargar los datos</h1>
        <p>${escapar(mensaje)}</p>
        <ol>
          <li>Verificá que <code>Code.gs</code> esté pegado en el Apps Script y que hayas ejecutado <code>bootstrap()</code>.</li>
          <li>Revisá que la implementación esté en <b>Ejecutar como: Yo</b> y <b>Acceso: Cualquier persona</b>.</li>
          <li>Después de cambiar el código, publicá con <b>Administrar implementaciones → Nueva versión</b>.</li>
        </ol>
      </div>`;
  };

  const arrancar = async () => {
    // Le avisa al diagnóstico de index.html que los módulos sí se ejecutaron, así
    // no pisa el mensaje de error con uno genérico.
    window.__appArranco = true;
    try {
      await cargar();
      const caja = document.getElementById('cargando');
      if (caja) caja.remove();
      document.getElementById('aplicacion').hidden = false;
      suscribir(() => {
        const marca = document.getElementById('nav');
        if (marca) pintarNavegacion();
      });
      window.addEventListener('hashchange', irA);
      irA();
    } catch (err) {
      mostrarError(err.message);
    }
  };

  arrancar();


  return __exp;
});

__req('ui/app.js');

</script>
</body>
</html>
