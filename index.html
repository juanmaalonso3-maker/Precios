<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precios y rentabilidad · Grupo Bitek</title>
<meta name="description" content="Control de precios de venta y rentabilidad por marketplace.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   SISTEMA DE DISEÑO

   Anclado en la identidad de Kenta: azul #0072CE (Pantone 285C) sobre gris
   frío. El rojo está reservado, en toda la aplicación, para un solo uso:
   márgenes negativos. Si algo está en rojo, se está perdiendo plata.

   Tres tipografías con roles distintos:
     Archivo        títulos, con tracking cerrado. Cuadrada, industrial.
     Inter          texto e interfaz.
     IBM Plex Mono  TODOS los números.

   El mono en los números no es decorativo: en una tabla de márgenes las
   columnas tienen que alinearse dígito a dígito para poder barrerlas con la
   vista. Con una tipografía proporcional, un 1 y un 8 ocupan distinto y la
   columna se desalinea.
   ══════════════════════════════════════════════════════════════════════════ */

:root {
  --ink: #0E1726;
  --ink-2: #3D4A5C;
  --muted: #6B7A8F;
  --tenue: #93A1B5;
  --paper: #F2F5F9;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --rule: #DCE3EC;
  --rule-fuerte: #C3CEDC;

  --kenta: #0072CE;
  --kenta-deep: #00538F;
  --kenta-tint: #E6F1FB;

  --perdida: #C0392B;
  --perdida-tint: #FBEBE9;

  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --display: 'Archivo', 'Inter', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;

  --r: 6px;
  --sombra: 0 1px 2px rgba(14, 23, 38, .06), 0 8px 24px -12px rgba(14, 23, 38, .18);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -.015em; margin: 0; }
code { font-family: var(--mono); font-size: .92em; background: var(--kenta-tint); padding: 1px 4px; border-radius: 3px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tenue { color: var(--muted); }
.der { text-align: right; }

/* ── Arranque ──────────────────────────────────────────────────────────── */
.arranque {
  position: fixed; inset: 0; display: grid; place-items: center;
  background: var(--paper); padding: 32px; z-index: 50;
}
.arranque__marca { font-family: var(--display); font-size: 20px; color: var(--kenta); letter-spacing: -.02em; }
.arranque__texto { color: var(--muted); margin-top: 8px; text-align: center; }
.arranque__barra { width: 180px; height: 3px; background: var(--rule); border-radius: 2px; margin: 20px auto 0; overflow: hidden; }
.arranque__barra::after {
  content: ''; display: block; height: 100%; width: 40%;
  background: var(--kenta); border-radius: 2px; animation: desliza 1.1s ease-in-out infinite;
}
@keyframes desliza { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
.arranque__error { max-width: 560px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 28px; }
.arranque__error h1 { font-size: 19px; margin-bottom: 10px; }
.arranque__error p { color: var(--ink-2); }
.arranque__error ol { color: var(--ink-2); padding-left: 20px; }
.arranque__error li { margin: 6px 0; }
.arranque__error pre {
  font-family: var(--mono); font-size: 12px; background: var(--ink); color: #E8EDF4;
  padding: 10px 13px; border-radius: var(--r); overflow-x: auto; margin: 10px 0;
}
.arranque__error details { margin-top: 14px; }
.arranque__error summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
.arranque__error summary:hover { color: var(--ink); }
.arranque__pie { font-size: 11.5px; color: var(--tenue); margin-top: 16px; word-break: break-all; }

/* ── Estructura ────────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 236px 1fr; height: 100vh; }

.lateral {
  background: var(--surface); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; overflow-y: auto;
}
.marca { padding: 20px 20px 16px; border-bottom: 1px solid var(--rule); }
.marca__nombre { font-family: var(--display); font-size: 15px; letter-spacing: -.02em; }
.marca__nombre b { color: var(--kenta); }
.marca__sub { font-size: 11px; color: var(--tenue); text-transform: uppercase; letter-spacing: .09em; margin-top: 3px; }

.nav { padding: 14px 12px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.nav__grupo { display: flex; flex-direction: column; gap: 1px; }
.nav__titulo {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--tenue); padding: 4px 8px 6px; font-weight: 600;
}
.nav__item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border-radius: var(--r); color: var(--ink-2);
  text-decoration: none; font-size: 13.5px; font-weight: 500;
  border-left: 2px solid transparent;
}
.nav__item:hover { background: var(--surface-2); color: var(--ink); }
.nav__item--activo { background: var(--kenta-tint); color: var(--kenta-deep); border-left-color: var(--kenta); }
.nav__marca {
  font-family: var(--mono); font-size: 11px; min-width: 19px; text-align: center;
  background: var(--perdida-tint); color: var(--perdida); border-radius: 9px; padding: 1px 5px; font-weight: 500;
}

.principal { display: flex; flex-direction: column; overflow: hidden; }
.cabecera {
  background: var(--surface); border-bottom: 1px solid var(--rule);
  padding: 16px 28px; display: flex; align-items: baseline;
  justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.cabecera h1 { font-size: 19px; }
.estado { display: flex; align-items: center; gap: 14px; font-size: 12px; }
.estado__dato { font-family: var(--mono); color: var(--muted); }
.estado__fuente {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
  border-radius: 20px; font-size: 11px; font-weight: 500;
  background: var(--kenta-tint); color: var(--kenta-deep);
}
.estado__fuente em { font-family: var(--mono); font-style: normal; opacity: .65; }
.estado__fuente--local { background: #FDF3E0; color: #8A5A0B; }

.contenido { padding: 22px 28px 60px; overflow-y: auto; flex: 1; }

/* ── Indicadores ───────────────────────────────────────────────────────── */
.indicadores {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 12px; margin-bottom: 22px;
}
.indicador {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  padding: 13px 15px; display: flex; flex-direction: column; gap: 2px;
}
.indicador--alerta { border-color: var(--perdida); background: var(--perdida-tint); }
.indicador--alerta .indicador__valor { color: var(--perdida); }
.indicador__etiqueta { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.indicador__valor { font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.indicador__pie { font-size: 11.5px; color: var(--tenue); }

/* ── Bloques ───────────────────────────────────────────────────────────── */
.bloque { margin-bottom: 30px; }
.bloque__cabecera { margin-bottom: 12px; }
.bloque__cabecera h2 { font-size: 15.5px; }
.bloque__cabecera p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 82ch; }

.nota {
  background: var(--kenta-tint); border-left: 2px solid var(--kenta);
  padding: 9px 13px; font-size: 12.5px; color: var(--kenta-deep); margin-bottom: 14px;
}
.pie-nota { color: var(--tenue); font-size: 12px; margin: 12px 0 0; max-width: 90ch; }

.lista-avisos { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.lista-avisos li {
  padding: 8px 12px; background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--r); margin-bottom: 6px; display: flex; align-items: center; gap: 9px;
}

/* ── Tablas ────────────────────────────────────────────────────────────── */
.tabla-scroll {
  overflow-x: auto; background: var(--surface);
  border: 1px solid var(--rule); border-radius: 8px;
}
.tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabla th {
  text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); font-weight: 600; padding: 10px 11px; white-space: nowrap;
  border-bottom: 1px solid var(--rule-fuerte); cursor: pointer; user-select: none;
  background: var(--surface-2); position: sticky; top: 0; z-index: 1;
}
.tabla th:hover { color: var(--ink); }
.tabla th.activo { color: var(--kenta-deep); }
.tabla td { padding: 8px 11px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.tabla tbody tr:last-child td { border-bottom: none; }
.tabla tbody tr:hover { background: var(--surface-2); }
.tabla td.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.vacio {
  background: var(--surface); border: 1px dashed var(--rule-fuerte); border-radius: 8px;
  padding: 34px; text-align: center; color: var(--muted); font-size: 13px;
}

.cifra-perdida { color: var(--perdida); font-weight: 500; }
.cifra-fuerte { font-weight: 500; }
.celda-sin-dato { color: var(--tenue); font-size: 12px; font-style: italic; }
.asterisco { color: var(--kenta); font-weight: 600; cursor: help; }

.celda-editable {
  font: inherit; font-family: var(--mono); background: none; border: none;
  border-bottom: 1px dashed var(--rule-fuerte); color: inherit;
  cursor: pointer; padding: 1px 2px; border-radius: 2px;
}
.celda-editable:hover { background: var(--kenta-tint); border-bottom-color: var(--kenta); color: var(--kenta-deep); }

.celda-canal { display: flex; flex-direction: column; gap: 3px; }
.celda-canal__precio { font-size: 13px; font-weight: 500; }
.celda-canal__utilidad { font-size: 11.5px; color: var(--muted); }

/* ══════════════════════════════════════════════════════════════════════════
   BARRA DE MARGEN — el elemento distintivo de la interfaz

   Anclada en una línea de cero central: crece a la derecha si hay ganancia y
   a la izquierda si hay pérdida. Recorriendo una columna, las pérdidas
   sobresalen hacia el lado contrario y se ven sin leer un número.

   Sin umbrales de color intermedios: el único corte que importa es el cero, y
   la línea del cero es la regla dibujada. La escala satura en ±40% porque
   arriba de eso la diferencia no cambia ninguna decisión, y comprimirla haría
   ilegibles los márgenes chicos, que son los que hay que vigilar.
   ══════════════════════════════════════════════════════════════════════════ */
.margen { display: flex; align-items: center; gap: 9px; }
.margen__pista {
  position: relative; flex: 1; min-width: 62px; height: 15px;
  background: var(--surface-2); border-radius: 2px; overflow: hidden;
}
.margen__pista::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
  width: 1px; background: var(--rule-fuerte); z-index: 1;
}
.margen__barra {
  position: absolute; top: 3px; bottom: 3px; border-radius: 1px;
  background: var(--kenta); animation: crece .35s ease-out;
}
.margen--perdida .margen__barra { background: var(--perdida); }
.margen__valor {
  font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
  min-width: 48px; text-align: right; font-weight: 500;
}
.margen--perdida .margen__valor { color: var(--perdida); }
.margen--vacio { color: var(--tenue); font-family: var(--mono); }
@keyframes crece { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) {
  .margen__barra { animation: none; }
  .arranque__barra::after { animation: none; width: 100%; }
}

/* ── Chips ─────────────────────────────────────────────────────────────── */
.chip {
  display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
  padding: 2px 7px; border-radius: 3px; background: var(--surface-2);
  color: var(--ink-2); border: 1px solid var(--rule); white-space: nowrap;
}
.chip--alerta { background: var(--perdida-tint); color: var(--perdida); border-color: var(--perdida); }
.chip--apagado { color: var(--tenue); }
.chip--mp { background: var(--kenta-tint); color: var(--kenta-deep); border-color: transparent; }
.chip--derivada { background: transparent; color: var(--tenue); border-style: dashed; margin-left: 6px; font-weight: 500; }
.aviso {
  display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 6px;
  border-radius: 50%; background: var(--perdida); color: #fff;
  font-size: 10px; font-weight: 700; cursor: help; vertical-align: middle;
}

/* ── Controles ─────────────────────────────────────────────────────────── */
.barra-herramientas {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px;
}
.buscador, select, input[type=number], input[type=text], input[type=search] {
  font: inherit; font-size: 13px; padding: 6px 10px;
  border: 1px solid var(--rule-fuerte); border-radius: var(--r);
  background: var(--surface); color: var(--ink);
}
.buscador { min-width: 260px; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--kenta); outline-offset: 1px;
}
.campo-inline { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }

.btn {
  font: inherit; font-size: 13px; font-weight: 500; padding: 6px 13px;
  border-radius: var(--r); border: 1px solid var(--kenta); background: var(--kenta);
  color: #fff; cursor: pointer; text-decoration: none; display: inline-block;
}
.btn:hover { background: var(--kenta-deep); border-color: var(--kenta-deep); }
.btn:disabled { opacity: .55; cursor: default; }
.btn--fantasma { background: var(--surface); color: var(--ink-2); border-color: var(--rule-fuerte); }
.btn--fantasma:hover { background: var(--surface-2); color: var(--ink); border-color: var(--rule-fuerte); }
.btn--mini { font-size: 11.5px; padding: 3px 9px; }
.enlace { background: none; border: none; font: inherit; color: var(--kenta); cursor: pointer; padding: 0; text-decoration: underline; }

/* ── Panel de edición ──────────────────────────────────────────────────── */
.panel-fondo {
  position: fixed; inset: 0; background: rgba(14, 23, 38, .34);
  display: flex; justify-content: flex-end; z-index: 40;
}
.panel {
  width: min(560px, 100%); background: var(--surface); display: flex; flex-direction: column;
  box-shadow: var(--sombra); animation: entra .18s ease-out;
}
@keyframes entra { from { transform: translateX(14px); opacity: .7; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
.panel__cabecera {
  padding: 16px 22px; border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between;
}
.panel__cabecera h2 { font-size: 16px; }
.panel__cerrar { background: none; border: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; }
.panel__cuerpo { padding: 20px 22px; overflow-y: auto; flex: 1; }
.panel__intro { margin: 0 0 16px; color: var(--ink-2); font-weight: 500; }
.panel__pie {
  padding: 14px 22px; border-top: 1px solid var(--rule);
  display: flex; justify-content: flex-end; gap: 9px; background: var(--surface-2);
}

.campo { display: block; margin-bottom: 14px; }
.campo__etiqueta { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--ink-2); }
.campo__etiqueta em { font-weight: 400; font-style: normal; color: var(--tenue); }
.campo input, .campo select { width: 100%; }
.campo__ayuda { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.campo__ayuda--marcada { background: var(--surface-2); border-left: 2px solid var(--rule-fuerte); padding: 7px 10px; margin-bottom: 14px; }

.grilla-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grilla-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 12px; }
.grilla-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 12px; }
.fila-objetivo { display: flex; gap: 8px; }
.fila-objetivo input { flex: 1; }

.grupo { border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px 4px; margin-bottom: 16px; }
.grupo legend { font-family: var(--display); font-size: 13px; font-weight: 600; padding: 0 6px; color: var(--kenta-deep); }

.previa {
  background: var(--surface-2); border: 1px solid var(--rule); border-radius: 8px;
  padding: 13px 15px; margin: 16px 0;
}
.previa__fila { display: flex; justify-content: space-between; gap: 14px; padding: 3px 0; font-size: 12.5px; color: var(--ink-2); }
.previa__fila--total { border-top: 1px solid var(--rule-fuerte); margin-top: 6px; padding-top: 7px; font-size: 13.5px; color: var(--ink); }
.previa__margen { margin-top: 10px; }

/* ── Notificaciones ────────────────────────────────────────────────────── */
#notificaciones { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.notificacion {
  display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff;
  padding: 10px 14px; border-radius: var(--r); font-size: 13px;
  box-shadow: var(--sombra); max-width: 400px;
}
.notificacion button { background: none; border: none; color: inherit; font-size: 17px; line-height: 1; cursor: pointer; opacity: .7; }
.notificacion--error { background: var(--perdida); }
.notificacion--aviso { background: #8A5A0B; }

/* ── Angosto ───────────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .lateral { border-right: none; border-bottom: 1px solid var(--rule); }
  .nav { flex-direction: row; flex-wrap: wrap; gap: 10px; }
  .nav__grupo { flex-direction: row; flex-wrap: wrap; }
  .nav__titulo { display: none; }
  .principal { overflow: visible; }
  .contenido { padding: 16px; overflow: visible; }
  .cabecera { padding: 14px 16px; }
  .grilla-2, .grilla-3, .grilla-4 { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="arranque" id="cargando">
  <div>
    <div class="arranque__marca">Precios y rentabilidad</div>
    <p class="arranque__texto">Cargando el catálogo y calculando márgenes…</p>
    <div class="arranque__barra"></div>
  </div>
</div>

<div class="app" id="aplicacion" hidden>
  <aside class="lateral">
    <div class="marca">
      <div class="marca__nombre">Grupo <b>Bitek</b></div>
      <div class="marca__sub">Precios y rentabilidad</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="principal">
    <header class="cabecera">
      <h1 id="titulo-vista">Panel general</h1>
      <div class="estado" id="estado-datos"></div>
    </header>
    <div class="contenido" id="vista"></div>
  </main>
</div>

<!--
  Diagnóstico de arranque.

  Script clásico (no módulo) a propósito: si los módulos ES no se ejecutan
  —el caso típico es abrir el archivo con doble clic, porque file:// los
  bloquea— este script igual corre y explica qué pasó. Sin esto la pantalla de
  carga se queda fija para siempre sin decir nada.
-->
<script>
(function () {
  var errores = [];
  var registrar = function (msg) { if (msg && errores.indexOf(msg) < 0) errores.push(msg); };

  window.addEventListener('error', function (e) {
    if (e.target && e.target.src) registrar('No se pudo cargar el archivo: ' + e.target.src);
    else registrar(e.message);
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    registrar(String((e.reason && e.reason.message) || e.reason));
  });

  setTimeout(function () {
    if (window.__appArranco) return;
    var caja = document.getElementById('cargando');
    if (!caja) return;

    var esArchivo = location.protocol === 'file:';
    var causa, arreglo;

    if (esArchivo) {
      causa = 'Abriste el archivo directamente desde el disco. El navegador bloquea los módulos de JavaScript cuando la dirección empieza con <code>file://</code>, así que la aplicación nunca llega a ejecutarse.';
      arreglo = '<p>Levantá un servidor local desde la carpeta del proyecto:</p>'
        + '<pre>python3 -m http.server 8080</pre>'
        + '<p>Y entrá a <code>http://localhost:8080</code>. En GitHub Pages funciona sin este paso.</p>';
    } else if (errores.length) {
      causa = 'Falló la carga de uno o más archivos del proyecto.';
      arreglo = '<p>Verificá que la estructura de carpetas esté completa: <code>index.html</code> en la raíz, '
        + 'y las carpetas <code>src/</code> y <code>data/</code> al lado, respetando mayúsculas y minúsculas.</p>';
    } else {
      causa = 'La aplicación no terminó de arrancar y no informó ningún error.';
      arreglo = '<p>Abrí la consola del navegador (F12, pestaña Consola) para ver el detalle.</p>';
    }

    caja.innerHTML = '<div class="arranque__error">'
      + '<h1>La aplicación no pudo arrancar</h1>'
      + '<p>' + causa + '</p>'
      + arreglo
      + (errores.length
        ? '<details><summary>Detalle técnico</summary><pre>' + errores.join('\n').replace(/</g, '&lt;') + '</pre></details>'
        : '')
      + '<p class="arranque__pie">Dirección actual: <code>' + String(location.href).replace(/</g, '&lt;') + '</code></p>'
      + '</div>';
  }, 5000);
})();
</script>
<script type="module" src="./src/ui/app.js"></script>
</body>
